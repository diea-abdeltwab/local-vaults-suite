<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Manga Vault</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --base:#1e1e2e;--mantle:#181825;--crust:#11111b;
  --surface0:#313244;--surface1:#45475a;--surface2:#585b70;
  --overlay0:#6c7086;--overlay1:#7f849c;--overlay2:#9399b2;
  --text:#cdd6f4;--subtext0:#a6adc8;--subtext1:#bac2de;
  --lavender:#b4befe;--blue:#89b4fa;--sapphire:#74c7ec;
  --sky:#89dceb;--teal:#94e2d5;--green:#a6e3a1;
  --yellow:#f9e2af;--peach:#fab387;--red:#f38ba8;
  --maroon:#eba0ac;--pink:#f5c2e7;--mauve:#cba6f7;
  --bdr:rgba(108,112,134,.28);--glow:rgba(203,166,247,.18);
  --hh:66px;
  --fd:'Bebas Neue',sans-serif;--fm:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.4,0,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:var(--base);color:var(--text);font-family:var(--fm);overflow:hidden;user-select:none;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--surface1);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--mauve);}

/* ══ TITLEBAR ══ */
#titlebar{
  -webkit-app-region:drag;
  position:fixed;top:0;left:0;right:0;height:var(--hh);z-index:1000;
  display:flex;align-items:center;padding:0 22px;gap:16px;
  background:rgba(17,17,27,.98);
  border-bottom:1px solid var(--bdr);
  overflow:hidden;
}
#titlebar::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1.5px;
  background:linear-gradient(90deg,transparent,var(--mauve),var(--pink),transparent);
  opacity:.5;
}
.win-btns{display:flex;gap:8px;-webkit-app-region:no-drag;flex-shrink:0;}
.wb{width:14px;height:14px;border-radius:50%;border:none;cursor:pointer;transition:all .2s;}
.wb:hover{transform:scale(1.25);}
#wc{background:#f38ba8;box-shadow:0 0 8px rgba(243,139,168,.5);}
#wm{background:#f9e2af;box-shadow:0 0 8px rgba(249,226,175,.5);}
#wx{background:#a6e3a1;box-shadow:0 0 8px rgba(166,227,161,.5);}
/* native desktop title bar present → hide our own window dots */
html.native-frame .win-btns{display:none;}
html.native-frame #titlebar{padding-left:18px;}

.tb-logo{
  font-family:var(--fd);font-size:1.9rem;letter-spacing:5px;flex-shrink:0;
  background:linear-gradient(135deg,var(--mauve),var(--pink));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  -webkit-app-region:drag;
}
.tb-right{flex:1;min-width:0;display:flex;align-items:center;gap:10px;justify-content:flex-end;-webkit-app-region:no-drag;}

.tb-input{
  background:rgba(49,50,68,.8);border:1px solid var(--bdr);color:var(--text);
  padding:9px 15px;border-radius:9px;font-size:14px;font-family:var(--fm);
  outline:none;width:210px;min-width:70px;flex:1 1 70px;max-width:210px;transition:.3s;
}
.tb-input:focus{border-color:var(--mauve);box-shadow:0 0 14px var(--glow);}
.tb-input::placeholder{color:var(--overlay0);}

.tb-btn{
  -webkit-app-region:no-drag;flex-shrink:0;
  background:rgba(49,50,68,.8);border:1px solid var(--bdr);color:var(--text);
  padding:9px 16px;border-radius:9px;font-size:14px;font-family:var(--fm);
  cursor:pointer;transition:all .2s var(--ease);white-space:nowrap;
}
.tb-btn:hover{background:var(--mauve);color:var(--crust);border-color:var(--mauve);}
.tb-btn.on{background:rgba(203,166,247,.15);border-color:rgba(203,166,247,.35);color:var(--mauve);}
.tb-sel{
  flex-shrink:0;
  background:rgba(49,50,68,.8);border:1px solid var(--bdr);color:var(--text);
  padding:9px 11px;border-radius:9px;font-size:14px;font-family:var(--fm);cursor:pointer;outline:none;
}
.tb-sel option{background:var(--mantle);}
#counter{
  flex-shrink:0;
  background:rgba(49,50,68,.8);border:1px solid var(--bdr);
  color:var(--mauve);padding:9px 16px;border-radius:20px;
  font-size:13px;white-space:nowrap;min-width:90px;text-align:center;
}

@media (max-width: 1050px){
  .tb-logo{font-size:1.5rem;letter-spacing:3px;}
  .tb-input{padding:9px 10px;}
  .tb-btn{padding:9px 11px;}
  #counter{padding:9px 10px;min-width:64px;font-size:12px;}
  .tb-right{gap:7px;}
  #titlebar{padding:0 14px;gap:10px;}
}

/* ══ WELCOME ══ */
#welcome{
  position:fixed;inset:0;z-index:500;
  display:flex;align-items:center;justify-content:center;
  background:var(--crust);transition:opacity .4s,visibility .4s;
}
#welcome::before{
  content:'';position:absolute;inset:-50%;pointer-events:none;
  background:linear-gradient(rgba(203,166,247,.04) 1px,transparent 1px),
             linear-gradient(90deg,rgba(203,166,247,.04) 1px,transparent 1px);
  background-size:40px 40px;animation:gridDrift 24s linear infinite;
}
#welcome::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 55% 45% at 25% 35%,rgba(203,166,247,.07),transparent),
             radial-gradient(ellipse 45% 55% at 75% 65%,rgba(245,194,231,.06),transparent);
}
@keyframes gridDrift{to{transform:translate(40px,40px);}}
#welcome.hidden{opacity:0;visibility:hidden;pointer-events:none;}
/* once hidden, the drifting grid must stop (it kept the compositor busy behind the reader) */
#welcome.hidden::before,#welcome.hidden::after{animation:none;display:none;}

.wbox{
  position:relative;z-index:1;width:min(680px,88vw);
  background:rgba(24,24,37,.88);backdrop-filter:blur(28px);
  border:1px solid rgba(203,166,247,.2);border-radius:28px;
  padding:52px 48px;text-align:center;
  box-shadow:0 0 60px rgba(203,166,247,.1),0 32px 80px rgba(0,0,0,.6);
}
.wbox-logo{
  font-family:var(--fd);font-size:clamp(3.5rem,7vw,5.5rem);letter-spacing:10px;line-height:1;
  background:linear-gradient(135deg,var(--mauve),var(--pink) 50%,var(--lavender));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 28px rgba(203,166,247,.22));margin-bottom:8px;
}
.wbox-sub{
  font-size:.72rem;letter-spacing:6px;color:var(--overlay1);text-transform:uppercase;
  margin-bottom:36px;
  display:flex;align-items:center;justify-content:center;gap:12px;
}
.wbox-sub::before,.wbox-sub::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--bdr),transparent);}

/* recent paths */
#recentPaths{margin-bottom:20px;display:flex;flex-direction:column;gap:8px;}
.recent-item{
  background:rgba(49,50,68,.4);border:1px solid var(--bdr);border-radius:10px;
  padding:11px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;
  transition:all .2s;text-align:left;
}
.recent-item:hover{border-color:var(--mauve);background:rgba(203,166,247,.08);}
.recent-icon{font-size:1.1rem;flex-shrink:0;}
.recent-info{flex:1;min-width:0;}
.recent-name{font-size:.85rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.recent-path{font-size:.62rem;color:var(--overlay0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.recent-arrow{color:var(--mauve);font-size:1rem;flex-shrink:0;}

.dropzone{
  border:1.5px dashed rgba(203,166,247,.25);border-radius:18px;
  padding:32px 24px;background:rgba(49,50,68,.2);
  cursor:pointer;transition:all .3s;
}
.dropzone:hover,.dropzone.over{
  border-color:var(--mauve);background:rgba(203,166,247,.07);
  box-shadow:0 0 30px rgba(203,166,247,.12);
}
.dz-icon{font-size:2.5rem;margin-bottom:10px;}
.dz-label{color:var(--subtext0);font-size:1rem;margin-bottom:20px;}
.btn-row{display:flex;gap:12px;justify-content:center;}
.btn-p{
  padding:13px 38px;
  background:linear-gradient(135deg,var(--mauve),var(--pink));
  border:none;border-radius:40px;color:var(--crust);
  font-size:15px;font-family:var(--fm);font-weight:600;
  cursor:pointer;transition:all .3s;box-shadow:0 0 20px rgba(203,166,247,.3);
}
.btn-p:hover{transform:translateY(-3px);box-shadow:0 0 34px rgba(203,166,247,.55);}

/* loading */
#loadState{display:none;padding:16px 0;}
.spinner{width:42px;height:42px;border:3px solid rgba(203,166,247,.15);border-top-color:var(--mauve);border-radius:50%;animation:spin .8s linear infinite;margin:10px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.prog-bar{width:100%;height:3px;background:rgba(203,166,247,.1);border-radius:2px;margin-top:14px;overflow:hidden;}
.prog-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--mauve),var(--pink));border-radius:2px;transition:width .2s;}
.load-msg{color:var(--sapphire);font-size:.88rem;margin-bottom:6px;}

/* ══ APP SCREENS ══ */
.app-screen{
  position:fixed;top:var(--hh);bottom:0;left:0;right:0;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .3s var(--ease),visibility .3s;
}
.app-screen.vis{opacity:1;visibility:visible;pointer-events:auto;}

/* ══ LIBRARY ══ */
#S-lib{display:flex;flex-direction:column;overflow:hidden;background:var(--base);}
.lib-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:26px 30px;}
.sec-label{
  font-family:var(--fd);font-size:1.1rem;letter-spacing:5px;color:var(--overlay1);
  text-transform:uppercase;margin-bottom:22px;
  display:flex;align-items:center;gap:12px;
}
.sec-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--bdr),transparent);}

.manga-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:22px;
}
.mcard{
  background:var(--mantle);border:1px solid var(--bdr);border-radius:16px;
  overflow:hidden;cursor:pointer;transition:all .3s var(--spring);position:relative;
}
/* off-screen cards cost nothing: the browser skips their layout/paint until needed */
.mcard{content-visibility:auto;contain-intrinsic-size:auto 440px;}
.mcard:hover{
  border-color:var(--mauve);
  transform:translateY(-8px) scale(1.01);
  box-shadow:0 24px 55px rgba(0,0,0,.6),0 0 0 1px rgba(203,166,247,.15),0 0 32px rgba(203,166,247,.08);
}
.mcard:hover .mcover-img{transform:scale(1.07);}
.mcard:hover .moverlay{opacity:1;}
.mcover{
  width:100%;aspect-ratio:2/3;
  background:linear-gradient(145deg,var(--surface0),var(--mantle));
  overflow:hidden;position:relative;
}
.mcover-img{
  width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease);
  image-rendering:high-quality;image-rendering:-webkit-optimize-contrast;-ms-interpolation-mode:bicubic;
}
.mcover-ph{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--fd);font-size:3rem;color:var(--mauve);opacity:.18;
}
.moverlay{
  position:absolute;inset:0;opacity:0;transition:opacity .3s;
  background:linear-gradient(to top,rgba(17,17,27,.93) 0%,rgba(17,17,27,.35) 50%,transparent 75%);
  display:flex;align-items:flex-end;padding:14px;
}
.moverlay span{font-family:var(--fd);font-size:.95rem;letter-spacing:3px;color:var(--mauve);}
.mbadge{
  position:absolute;top:10px;right:10px;
  background:rgba(11,11,27,.9);
  color:var(--mauve);border:1px solid rgba(203,166,247,.25);
  font-size:.72rem;padding:4px 11px;border-radius:20px;
}
.mprog{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.05);}
.mprog-f{height:100%;background:linear-gradient(90deg,var(--mauve),var(--pink));transition:width .5s;}
.minfo{padding:14px 16px 16px;background:linear-gradient(180deg,var(--mantle),rgba(24,24,37,.98));}
.mname{font-size:.92rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px;}
.mmeta{display:flex;align-items:center;justify-content:space-between;}
.mmeta-l{font-size:.72rem;color:var(--overlay1);}
.mpill{font-size:.65rem;padding:3px 9px;border-radius:10px;}
.mpill.fresh{background:rgba(137,180,250,.08);color:var(--blue);border:1px solid rgba(137,180,250,.15);}
.mpill.wip{background:rgba(203,166,247,.1);color:var(--mauve);border:1px solid rgba(203,166,247,.15);}
.mpill.done{background:rgba(166,227,161,.1);color:var(--green);border:1px solid rgba(166,227,161,.2);}

/* ══ CHAPTER LIST ══ */
#S-chap{display:flex;flex-direction:column;overflow:hidden;background:var(--base);}
.chapbar{
  flex-shrink:0;padding:18px 28px;
  background:rgba(24,24,37,.95);border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;gap:14px;
}
.chapbar-thumb{
  width:58px;height:78px;border-radius:9px;overflow:hidden;flex-shrink:0;
  background:linear-gradient(145deg,var(--surface0),var(--mantle));
}
.chapbar-thumb img{width:100%;height:100%;object-fit:cover;image-rendering:high-quality;}
.chapbar-info{flex:1;min-width:0;}
.chapbar-title{font-family:var(--fd);font-size:1.6rem;letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chapbar-sub{font-size:.75rem;color:var(--overlay0);margin-top:3px;}
.chap-body{flex:1;min-height:0;overflow-y:auto;padding:22px 28px;}

.continue-wrap{
  margin-bottom:20px;
  background:linear-gradient(135deg,rgba(203,166,247,.1),rgba(245,194,231,.06));
  border:1px solid rgba(203,166,247,.2);border-radius:14px;
  padding:17px 22px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:.2s;
}
.continue-wrap:hover{border-color:var(--mauve);background:rgba(203,166,247,.13);}
.continue-icon{font-size:2rem;}
.continue-info{flex:1;}
.continue-lbl{font-size:.72rem;color:var(--overlay1);margin-bottom:3px;}
.continue-ch{font-family:var(--fd);font-size:1.25rem;letter-spacing:2px;color:var(--mauve);}
.continue-arrow{color:var(--mauve);font-size:1.5rem;}

.chap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:11px;}
.chap-group{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;margin:14px 2px 2px;padding-bottom:6px;border-bottom:1px solid rgba(203,166,247,.18);font-family:var(--fd);letter-spacing:2px;font-size:.85rem;color:var(--subtext0);}
.chap-group:first-child{margin-top:0;}
.chap-swap{background:transparent;border:1px solid var(--surface1);color:var(--overlay1);border-radius:8px;padding:3px 10px;font:inherit;letter-spacing:1px;font-size:.7rem;cursor:pointer;}
.chap-swap:hover{border-color:var(--mauve);color:var(--mauve);}
.ci{
  background:rgba(49,50,68,.45);border:1px solid var(--bdr);border-radius:11px;
  padding:18px 12px;cursor:pointer;transition:all .2s var(--spring);text-align:center;position:relative;
}
.ci:hover{background:var(--mauve);border-color:var(--mauve);transform:scale(1.05);box-shadow:0 8px 22px rgba(203,166,247,.28);}
.ci.read{border-color:rgba(166,227,161,.2);}
.ci.cur{border-color:var(--mauve);background:rgba(203,166,247,.1);}
.ci-num{font-family:var(--fd);font-size:1.2rem;color:var(--mauve);transition:.15s;}
.ci:hover .ci-num,.ci:hover .ci-pg{color:var(--crust);}
.ci.read .ci-num{color:var(--green);}
.ci-pg{font-size:.67rem;color:var(--overlay0);margin-top:5px;transition:.15s;}
.ci-dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--green);}
.ci-curdot{position:absolute;top:5px;left:5px;width:7px;height:7px;border-radius:50%;background:var(--mauve);}

/* ══ READER ══ */
#S-read{display:flex;flex-direction:column;overflow:hidden;background:var(--crust);}
.rbar{
  flex-shrink:0;height:66px;padding:0 20px;
  background:rgba(17,17,27,.97);border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;gap:10px;
  transition:opacity .3s;position:relative;z-index:20;
}
.rbar::after{
  content:'';position:absolute;top:0;left:0;right:0;height:1.5px;
  background:linear-gradient(90deg,transparent,var(--mauve),var(--pink),transparent);opacity:.35;
}
.rbar.hide{opacity:0;pointer-events:none;}
.rtitle{flex:1;min-width:0;font-family:var(--fd);font-size:1.1rem;letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rctrl{display:flex;align-items:center;gap:9px;flex-shrink:0;}
.rnav{
  background:linear-gradient(135deg,var(--mauve),var(--pink));
  border:none;color:var(--crust);
  padding:10px 20px;border-radius:9px;cursor:pointer;
  font-size:.85rem;font-weight:700;font-family:var(--fm);transition:all .2s;
}
.rnav:hover{transform:scale(1.06);box-shadow:0 0 20px rgba(203,166,247,.45);}
.rnav:disabled{opacity:.22;cursor:not-allowed;transform:none;box-shadow:none;}
.rsel{
  background:rgba(49,50,68,.9);border:1px solid var(--bdr);color:var(--text);
  padding:9px 11px;border-radius:9px;font-size:.82rem;font-family:var(--fm);
  cursor:pointer;outline:none;transition:.2s;
}
.rsel option{background:var(--mantle);}
.rpages{
  background:rgba(49,50,68,.9);border:1px solid var(--bdr);
  color:var(--mauve);padding:9px 14px;border-radius:9px;
  font-size:.82rem;min-width:80px;text-align:center;white-space:nowrap;
}

.r-prog{flex-shrink:0;height:2px;background:var(--surface0);position:relative;z-index:19;}
.r-prog-f{height:100%;width:0%;background:linear-gradient(90deg,var(--mauve),var(--pink));transition:width .12s;}

.rscroll{flex:1;min-height:0;overflow-y:scroll;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
.strip{display:flex;flex-direction:column;align-items:center;width:100%;}
.strip img{
  display:block;width:800px;max-width:100%;height:auto;
  image-rendering:auto;image-rendering:high-quality;
  image-rendering:-webkit-optimize-contrast;-ms-interpolation-mode:bicubic;
  vertical-align:bottom;border:none;
  margin-bottom:-1px;
}
.strip.fw img{width:100%;}
.strip.cm img{width:620px;}
.strip.wd img{width:1100px;}

.totop{
  position:fixed;bottom:22px;right:22px;z-index:200;
  background:linear-gradient(135deg,var(--mauve),var(--pink));
  color:var(--crust);border:none;width:46px;height:46px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:1.2rem;
  cursor:pointer;box-shadow:0 4px 20px rgba(203,166,247,.35);
  transition:all .25s var(--spring);opacity:0;pointer-events:none;
}
.totop.on{opacity:1;pointer-events:auto;}
.totop:hover{transform:scale(1.15);}

/* ══ LIGHTBOX ══ */
#lightbox{
  position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.97);
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:.3s;
}
#lightbox.on{opacity:1;visibility:visible;}
#lb-img{max-width:90vw;max-height:90vh;object-fit:contain;border-radius:6px;cursor:zoom-in;transition:transform .2s;}
#lb-img.zoomed{cursor:zoom-out;}
#lb-close{
  position:absolute;top:18px;right:18px;
  background:rgba(49,50,68,.8);border:1px solid var(--bdr);color:var(--text);
  width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:1.2rem;transition:.2s;backdrop-filter:blur(8px);
}
#lb-close:hover{background:var(--red);color:var(--crust);}


/* ══ PDF READER ══ */
.pdf-frame{
  width:100%;height:100%;border:none;
  background:var(--crust);
}
.pdf-toolbar-notice{
  flex-shrink:0;
  background:rgba(203,166,247,.08);border-bottom:1px solid rgba(203,166,247,.15);
  padding:8px 20px;font-size:.72rem;color:var(--overlay1);
  display:flex;align-items:center;gap:8px;
}
.pdf-toolbar-notice span{color:var(--mauve);}
.mcover-pdf{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(145deg,var(--surface0),var(--mantle));
}
.mcover-pdf-icon{font-size:2.8rem;}
.mcover-pdf-label{font-size:.6rem;color:var(--overlay0);letter-spacing:2px;text-transform:uppercase;}
.pdf-badge{
  position:absolute;top:10px;left:10px;
  background:rgba(243,139,168,.15);border:1px solid rgba(243,139,168,.3);
  color:var(--red);font-size:.6rem;padding:3px 8px;border-radius:20px;
}

/* ══ TOAST ══ */
#toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(10px);z-index:4000;
  background:rgba(69,71,90,.95);color:var(--text);
  border:1px solid var(--bdr);backdrop-filter:blur(14px);
  padding:10px 22px;border-radius:20px;font-size:.75rem;white-space:nowrap;
  opacity:0;pointer-events:none;transition:.3s;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- TITLEBAR -->
<div id="titlebar">
  <div class="win-btns">
    <button class="wb" id="wc"></button>
    <button class="wb" id="wm"></button>
    <button class="wb" id="wx"></button>
  </div>
  <div class="tb-logo">VAULT</div>
  <div class="tb-right">
    <input type="text" id="searchBar" class="tb-input" placeholder="🔍  Search manga…" style="display:none">
    <select id="sortSel" class="tb-sel" style="display:none">
      <option value="az">A → Z</option>
      <option value="za">Z → A</option>
      <option value="prog">By Progress</option>
      <option value="most">Most Read</option>
    </select>
    <button class="tb-btn" id="tb-change" style="display:none">⏏ Change</button>
    <button class="tb-btn" id="tb-fs">⛶</button>
    <div id="counter" style="display:none">0 manga</div>
  </div>
</div>

<!-- WELCOME -->
<div id="welcome">
  <div class="wbox">
    <div class="wbox-logo">MANGA VAULT</div>
    <div class="wbox-sub">Catppuccin Mocha · Local Reader</div>

    <!-- Recent paths (injected by JS) -->
    <div id="recentPaths"></div>

    <div class="dropzone" id="dropzone">
      <div id="dzMain">
        <div class="dz-icon">📚</div>
        <div class="dz-label">Drop your manga folder here</div>
        <div class="btn-row">
          <button class="btn-p" id="openBtn">Open Folder</button>
        </div>
      </div>
      <div id="loadState">
        <div class="load-msg" id="loadMsg">Scanning…</div>
        <div class="spinner"></div>
        <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
      </div>
    </div>
  </div>
</div>

<!-- LIBRARY -->
<div class="app-screen" id="S-lib">
  <div class="lib-body">
    <div class="sec-label" id="libLabel">Series</div>
    <div class="manga-grid" id="mangaGrid"></div>
  </div>
</div>

<!-- CHAPTER LIST -->
<div class="app-screen" id="S-chap">
  <div class="chapbar">
    <div class="chapbar-thumb"><img id="chapCover" src="" alt=""></div>
    <div class="chapbar-info">
      <div class="chapbar-title" id="chapTitle">—</div>
      <div class="chapbar-sub" id="chapSub">—</div>
    </div>
    <button class="tb-btn" id="chapBackBtn">← Back</button>
    <button class="tb-btn" id="readAllBtn">Read All ▶</button>
  </div>
  <div class="chap-body">
    <div id="continueSlot"></div>
    <div class="chap-grid" id="chapGrid"></div>
  </div>
</div>

<!-- READER -->
<div class="app-screen" id="S-read">
  <div class="rbar" id="rbar">
    <button class="tb-btn" id="rBackBtn">← Back</button>
    <div class="rtitle" id="rTitle">—</div>
    <div class="rctrl">
      <button class="rnav" id="rPrev">◀ PREV</button>
      <button class="rnav" id="rNext">NEXT ▶</button>
      <select class="rsel" id="widthSel">
        <option value="">Normal (800px)</option>
        <option value="cm">Compact (620px)</option>
        <option value="fw">Fit Width</option>
        <option value="wd">Wide (1100px)</option>
      </select>
      <div class="rpages" id="rPages">—</div>
    </div>
  </div>
  <div class="r-prog"><div class="r-prog-f" id="rProgF"></div></div>
  <div class="rscroll" id="rScroll">
    <div class="strip" id="strip"></div>
  </div>
  <button class="totop" id="toTop">↑</button>
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <button id="lb-close">✕</button>
  <img id="lb-img" src="" alt="">
</div>

<!-- TOAST -->
<div id="toast"></div>

<script src="renderer.js"></script>
</body>
</html>
<!-- PDF READER injected by JS into #S-read when isPDF -->
