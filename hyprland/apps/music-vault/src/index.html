<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Music Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@300;400;600&family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --base:#1e1e2e;--mantle:#181825;--crust:#11111b;
  --surface0:#313244;--surface1:#45475a;--surface2:#585b70;
  --overlay0:#6c7086;--overlay1:#7f849c;--overlay2:#9399b2;
  --text:#cdd6f4;--subtext0:#a6adc8;--subtext1:#bac2de;
  --lavender:#b4befe;--blue:#89b4fa;--sapphire:#74c7ec;
  --sky:#89dceb;--teal:#94e2d5;--green:#a6e3a1;
  --yellow:#f9e2af;--peach:#fab387;--red:#f38ba8;
  --maroon:#eba0ac;--pink:#f5c2e7;--mauve:#cba6f7;
  /* Music accent: mauve + pink */
  --accent:#cba6f7;--accent2:#f5c2e7;--accentGlow:rgba(203,166,247,.18);
  --bdr:rgba(108,112,134,.28);
  --hh:66px;
  --fd:'Bebas Neue',sans-serif;--fm:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.4,0,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:var(--base);color:var(--text);font-family:var(--fm);overflow:hidden;user-select:none;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--surface1);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--accent);}

/* ══ TITLEBAR ══ */
#titlebar{
  -webkit-app-region:drag;
  position:fixed;top:0;left:0;right:0;height:var(--hh);z-index:1000;
  display:flex;align-items:center;padding:0 22px;gap:16px;
  background:rgba(17,17,27,.97);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bdr);
}
#titlebar::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1.5px;
  background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent);
  opacity:.5;
}
.win-btns{display:flex;gap:8px;-webkit-app-region:no-drag;flex-shrink:0;}
.wb{width:14px;height:14px;border-radius:50%;border:none;cursor:pointer;transition:all .2s;}
.wb:hover{transform:scale(1.25);}
#wc{background:#f38ba8;box-shadow:0 0 8px rgba(243,139,168,.5);}
#wm{background:#f9e2af;box-shadow:0 0 8px rgba(249,226,175,.5);}
#wx{background:#a6e3a1;box-shadow:0 0 8px rgba(166,227,161,.5);}

.tb-logo{
  font-family:var(--fd);font-size:1.9rem;letter-spacing:5px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  -webkit-app-region:drag;
}
.tb-right{flex:1;display:flex;align-items:center;gap:10px;justify-content:flex-end;-webkit-app-region:no-drag;}
.tb-input{
  background:rgba(49,50,68,.8);border:1px solid var(--bdr);color:var(--text);
  padding:9px 15px;border-radius:9px;font-size:14px;font-family:var(--fm);
  outline:none;width:210px;transition:.3s;
}
.tb-input:focus{border-color:var(--accent);width:260px;box-shadow:0 0 14px var(--accentGlow);}
.tb-input::placeholder{color:var(--overlay0);}
.tb-btn{
  -webkit-app-region:no-drag;
  background:rgba(49,50,68,.8);border:1px solid var(--bdr);color:var(--text);
  padding:9px 16px;border-radius:9px;font-size:14px;font-family:var(--fm);
  cursor:pointer;transition:all .2s var(--ease);white-space:nowrap;
}
.tb-btn:hover{background:var(--accent);color:var(--crust);border-color:var(--accent);}
.tb-sel{
  background:rgba(49,50,68,.8);border:1px solid var(--bdr);color:var(--text);
  padding:9px 11px;border-radius:9px;font-size:14px;font-family:var(--fm);cursor:pointer;outline:none;
}
.tb-sel option{background:var(--mantle);}
#counter{
  background:rgba(49,50,68,.8);border:1px solid var(--bdr);
  color:var(--accent);padding:9px 16px;border-radius:20px;
  font-size:13px;white-space:nowrap;min-width:90px;text-align:center;
}

/* filter row */
#filterRow{display:flex;gap:8px;-webkit-app-region:no-drag;}
.filter-btn{
  background:rgba(49,50,68,.6);border:1px solid var(--bdr);color:var(--subtext0);
  padding:7px 14px;border-radius:20px;font-size:.72rem;font-family:var(--fm);cursor:pointer;transition:.2s;
}
.filter-btn:hover{border-color:var(--accent);color:var(--accent);}
.filter-btn.on{background:rgba(203,166,247,.12);border-color:var(--accent);color:var(--accent);}

/* ══ WELCOME ══ */
#welcome{
  position:fixed;inset:0;z-index:500;
  display:flex;align-items:center;justify-content:center;
  background:var(--crust);transition:opacity .4s,visibility .4s;
}
#welcome::before{
  content:'';position:absolute;inset:-50%;pointer-events:none;
  background:linear-gradient(rgba(203,166,247,.04) 1px,transparent 1px),
             linear-gradient(90deg,rgba(203,166,247,.04) 1px,transparent 1px);
  background-size:40px 40px;animation:gridDrift 24s linear infinite;
}
#welcome::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 55% 45% at 25% 35%,rgba(203,166,247,.07),transparent),
             radial-gradient(ellipse 45% 55% at 75% 65%,rgba(245,194,231,.06),transparent);
}
@keyframes gridDrift{to{transform:translate(40px,40px);}}
#welcome.hidden{opacity:0;visibility:hidden;pointer-events:none;}

.wbox{
  position:relative;z-index:1;width:min(700px,88vw);
  background:rgba(24,24,37,.88);backdrop-filter:blur(28px);
  border:1px solid rgba(203,166,247,.2);border-radius:28px;
  padding:52px 48px;text-align:center;
  box-shadow:0 0 60px rgba(203,166,247,.1),0 32px 80px rgba(0,0,0,.6);
}
.wbox-logo{
  font-family:var(--fd);font-size:clamp(3.5rem,7vw,5.5rem);letter-spacing:10px;line-height:1;
  background:linear-gradient(135deg,var(--accent),var(--accent2) 50%,var(--lavender));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 28px rgba(203,166,247,.22));margin-bottom:8px;
}
.wbox-sub{
  font-size:.72rem;letter-spacing:6px;color:var(--overlay1);text-transform:uppercase;
  margin-bottom:36px;
  display:flex;align-items:center;justify-content:center;gap:12px;
}
.wbox-sub::before,.wbox-sub::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--bdr),transparent);}

#recentPaths{margin-bottom:20px;display:flex;flex-direction:column;gap:8px;}
.recent-item{
  background:rgba(49,50,68,.4);border:1px solid var(--bdr);border-radius:10px;
  padding:11px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;
  transition:all .2s;text-align:left;
}
.recent-item:hover{border-color:var(--accent);background:rgba(203,166,247,.08);}
.recent-icon{font-size:1.1rem;flex-shrink:0;}
.recent-info{flex:1;min-width:0;}
.recent-name{font-size:.85rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.recent-path{font-size:.62rem;color:var(--overlay0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.recent-arrow{color:var(--accent);font-size:1rem;flex-shrink:0;}

.dropzone{
  border:1.5px dashed rgba(203,166,247,.25);border-radius:18px;
  padding:32px 24px;background:rgba(49,50,68,.2);
  cursor:pointer;transition:all .3s;
}
.dropzone:hover,.dropzone.over{
  border-color:var(--accent);background:rgba(203,166,247,.07);
  box-shadow:0 0 30px rgba(203,166,247,.12);
}
.dz-icon{font-size:2.5rem;margin-bottom:10px;}
.dz-label{color:var(--subtext0);font-size:1rem;margin-bottom:20px;}
.dz-hint{color:var(--overlay0);font-size:.72rem;margin-bottom:20px;line-height:1.6;}
.btn-row{display:flex;gap:12px;justify-content:center;}
.btn-p{
  padding:13px 38px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;border-radius:40px;color:var(--crust);
  font-size:15px;font-family:var(--fm);font-weight:600;
  cursor:pointer;transition:all .3s;box-shadow:0 0 20px rgba(203,166,247,.3);
}
.btn-p:hover{transform:translateY(-3px);box-shadow:0 0 34px rgba(203,166,247,.55);}

#loadState{display:none;padding:16px 0;}
.spinner{width:42px;height:42px;border:3px solid rgba(203,166,247,.15);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:10px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.prog-bar{width:100%;height:3px;background:rgba(203,166,247,.1);border-radius:2px;margin-top:14px;overflow:hidden;}
.prog-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .2s;}
.load-msg{color:var(--sapphire);font-size:.88rem;margin-bottom:6px;}

/* ══ APP SCREENS ══ */
.app-screen{
  position:fixed;top:var(--hh);bottom:0;left:0;right:0;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .3s var(--ease),visibility .3s;
}
.app-screen.vis{opacity:1;visibility:visible;pointer-events:auto;}

/* ══ LIBRARY (artist grid) ══ */
#S-lib{display:flex;flex-direction:column;overflow:hidden;background:var(--base);}
.lib-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:26px 30px;}
.sec-label{
  font-family:var(--fd);font-size:1.1rem;letter-spacing:5px;color:var(--overlay1);
  text-transform:uppercase;margin-bottom:22px;
  display:flex;align-items:center;gap:12px;
}
.sec-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--bdr),transparent);}

.title-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:24px;
}
.tcard{
  background:var(--mantle);border:1px solid var(--bdr);border-radius:20px;
  overflow:hidden;cursor:pointer;transition:all .3s var(--spring);position:relative;
}
.tcard:hover{
  border-color:var(--accent);
  transform:translateY(-10px) scale(1.01);
  box-shadow:0 28px 65px rgba(0,0,0,.65),0 0 0 1px rgba(203,166,247,.18),0 0 40px rgba(203,166,247,.1);
}
.tcard:hover .tcover-img{transform:scale(1.07);}
.tcard:hover .toverlay{opacity:1;}
/* Tall cover for music genres — portrait */
.tcover{
  width:100%;aspect-ratio:3/4;
  background:linear-gradient(145deg,var(--surface0),var(--mantle));
  overflow:hidden;position:relative;
}
.tcover-img{
  width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease);
  image-rendering:high-quality;
}
.tcover-ph{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--fd);font-size:5rem;color:var(--accent);opacity:.18;
}
.toverlay{
  position:absolute;inset:0;opacity:0;transition:opacity .3s;
  background:linear-gradient(to top,rgba(17,17,27,.95) 0%,rgba(17,17,27,.4) 50%,transparent 75%);
  display:flex;align-items:flex-end;padding:18px;
}
.toverlay span{font-family:var(--fd);font-size:1.1rem;letter-spacing:4px;color:var(--accent);}
.tbadge{
  position:absolute;top:12px;right:12px;
  background:rgba(11,11,27,.82);backdrop-filter:blur(10px);
  color:var(--accent);border:1px solid rgba(203,166,247,.28);
  font-size:.68rem;padding:5px 12px;border-radius:20px;
}
.tprog{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.05);}
.tprog-f{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s;}
.tinfo{padding:14px 18px 16px;}
.tname{font-size:1rem;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px;}
.tmeta{display:flex;align-items:center;justify-content:space-between;}
.tmeta-l{font-size:.72rem;color:var(--overlay1);}
.mpill{font-size:.64rem;padding:4px 11px;border-radius:10px;}
.mpill.fresh{background:rgba(137,180,250,.08);color:var(--blue);border:1px solid rgba(137,180,250,.15);}
.mpill.has-clips{background:rgba(203,166,247,.1);color:var(--mauve);border:1px solid rgba(203,166,247,.2);}
.mpill.audio-only{background:rgba(166,227,161,.1);color:var(--green);border:1px solid rgba(166,227,161,.2);}

/* ══ TRACK LIST ══ */
#S-ep{display:flex;flex-direction:column;overflow:hidden;background:var(--base);}
.epbar{
  flex-shrink:0;padding:18px 28px;
  background:rgba(24,24,37,.95);border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;gap:14px;
}
.epbar-thumb{
  width:62px;height:62px;border-radius:10px;overflow:hidden;flex-shrink:0;
  background:linear-gradient(145deg,var(--surface0),var(--mantle));
}
.epbar-thumb img{width:100%;height:100%;object-fit:cover;}
.epbar-info{flex:1;min-width:0;}
.epbar-title{font-family:var(--fd);font-size:1.6rem;letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.epbar-sub{font-size:.75rem;color:var(--overlay0);margin-top:3px;}
.ep-body{flex:1;min-height:0;overflow-y:auto;padding:22px 28px;}

/* album tabs */
#seasonsBar{
  display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;
}
.season-btn{
  background:rgba(49,50,68,.5);border:1px solid var(--bdr);color:var(--subtext0);
  padding:7px 16px;border-radius:20px;font-size:.72rem;font-family:var(--fm);cursor:pointer;transition:.2s;
}
.season-btn:hover{border-color:var(--accent);color:var(--accent);}
.season-btn.on{background:rgba(203,166,247,.12);border-color:var(--accent);color:var(--accent);}

.continue-wrap{
  margin-bottom:20px;
  background:linear-gradient(135deg,rgba(203,166,247,.1),rgba(245,194,231,.06));
  border:1px solid rgba(203,166,247,.2);border-radius:14px;
  padding:17px 22px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:.2s;
}
.continue-wrap:hover{border-color:var(--accent);background:rgba(203,166,247,.13);}
.continue-icon{font-size:2rem;}
.continue-info{flex:1;}
.continue-lbl{font-size:.72rem;color:var(--overlay1);margin-bottom:3px;}
.continue-ch{font-family:var(--fd);font-size:1.25rem;letter-spacing:2px;color:var(--accent);}
.continue-arrow{color:var(--accent);font-size:1.5rem;}

/* ── Track list rows (audio) ── */
.track-list{display:flex;flex-direction:column;gap:4px;}
.ei{
  background:rgba(49,50,68,.35);border:1px solid var(--bdr);border-radius:10px;
  padding:10px 16px;cursor:pointer;transition:all .18s;
  display:flex;align-items:center;gap:14px;position:relative;
  min-height:52px;
}
.ei:hover{background:rgba(203,166,247,.1);border-color:var(--accent);}
.ei.playing{border-color:var(--accent);background:rgba(203,166,247,.12);}
.ei-num{
  font-size:.65rem;color:var(--overlay0);min-width:28px;text-align:right;flex-shrink:0;
}
.ei.playing .ei-num{color:var(--accent);}
.ei-thumb{
  width:38px;height:38px;border-radius:6px;overflow:hidden;flex-shrink:0;
  background:linear-gradient(145deg,var(--surface0),var(--mantle));
}
.ei-thumb img{width:100%;height:100%;object-fit:cover;}
.ei-info{flex:1;min-width:0;}
.ei-name{
  font-size:.82rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:.15s;
}
.ei:hover .ei-name,.ei.playing .ei-name{color:var(--accent);}
.ei-album{font-size:.62rem;color:var(--overlay0);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ei-type{
  font-size:.6rem;padding:2px 8px;border-radius:8px;flex-shrink:0;
}
.ei-type.clip{background:rgba(203,166,247,.12);color:var(--mauve);border:1px solid rgba(203,166,247,.2);}
.ei-type.audio{background:rgba(166,227,161,.08);color:var(--green);border:1px solid rgba(166,227,161,.15);}
.ei-dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--green);z-index:1;}
.ei-eq{
  display:flex;align-items:flex-end;gap:2px;height:16px;flex-shrink:0;
}
.ei-eq-bar{
  width:3px;background:var(--accent);border-radius:1px;
  animation:eq-bounce .6s ease-in-out infinite alternate;
}
.ei-eq-bar:nth-child(2){animation-delay:.15s;}
.ei-eq-bar:nth-child(3){animation-delay:.3s;}
@keyframes eq-bounce{
  from{height:4px;}
  to{height:14px;}
}

/* ── Clip grid (video thumbnails) ── */
.clip-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:18px;
}
.cg-card{
  background:var(--mantle);border:1px solid var(--bdr);border-radius:14px;
  overflow:hidden;cursor:pointer;transition:all .28s var(--spring);position:relative;
}
.cg-card:hover{
  border-color:var(--accent);
  transform:translateY(-6px) scale(1.01);
  box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 28px rgba(203,166,247,.1);
}
.cg-card:hover .cg-thumb-img{transform:scale(1.05);}
.cg-card:hover .cg-play-btn{opacity:1;transform:translate(-50%,-50%) scale(1);}
.cg-card.playing{border-color:var(--accent);box-shadow:0 0 0 2px rgba(203,166,247,.3);}

/* 16:9 thumbnail */
.cg-thumb{
  width:100%;aspect-ratio:16/9;
  background:linear-gradient(145deg,var(--surface0),var(--crust));
  overflow:hidden;position:relative;
}
.cg-thumb-img{
  width:100%;height:100%;object-fit:cover;
  transition:transform .5s var(--ease);
}
.cg-thumb-ph{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:2.5rem;opacity:.3;
  background:linear-gradient(135deg,var(--surface0),var(--mantle));
}
/* Play button overlay */
.cg-play-btn{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(.85);
  width:52px;height:52px;border-radius:50%;
  background:rgba(203,166,247,.92);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;opacity:0;transition:all .25s var(--spring);
  box-shadow:0 0 28px rgba(203,166,247,.5);
}
/* Duration badge */
.cg-dur{
  position:absolute;bottom:8px;right:10px;
  background:rgba(0,0,0,.78);backdrop-filter:blur(6px);
  color:#fff;font-size:.62rem;padding:2px 8px;border-radius:6px;
  font-family:var(--fm);
}
/* Playing EQ overlay */
.cg-eq-overlay{
  position:absolute;inset:0;background:rgba(17,17,27,.65);
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.cg-eq-bar{
  width:4px;background:var(--accent);border-radius:2px;
  animation:eq-bounce .55s ease-in-out infinite alternate;
}
.cg-eq-bar:nth-child(2){animation-delay:.12s;height:18px!important;}
.cg-eq-bar:nth-child(3){animation-delay:.24s;}
.cg-eq-bar:nth-child(4){animation-delay:.36s;}

.cg-info{padding:10px 14px 12px;}
.cg-name{
  font-size:.82rem;font-weight:600;color:var(--text);
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  line-height:1.4;min-height:2.4em;margin-bottom:5px;transition:.15s;
}
.cg-card:hover .cg-name,.cg-card.playing .cg-name{color:var(--accent);}
.cg-meta{display:flex;align-items:center;justify-content:space-between;}
.cg-album{font-size:.62rem;color:var(--overlay0);}
.cg-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;}

/* ══ PLAYER ══ */
#S-player{display:flex;flex-direction:column;overflow:hidden;background:var(--base);}

/* Top nav bar */
#pbar{
  flex-shrink:0;height:56px;padding:0 18px;
  background:rgba(17,17,27,.97);border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;gap:10px;
  transition:opacity .3s;position:relative;z-index:20;
}
#pbar::after{
  content:'';position:absolute;top:0;left:0;right:0;height:1.5px;
  background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent);opacity:.35;
}
#pbar.hide{opacity:0;pointer-events:none;}
.ptitle{flex:1;min-width:0;font-family:var(--fd);font-size:1.1rem;letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pctrl{display:flex;align-items:center;gap:9px;flex-shrink:0;}
.pnav{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;color:var(--crust);
  padding:9px 18px;border-radius:9px;cursor:pointer;
  font-size:.82rem;font-weight:700;font-family:var(--fm);transition:all .2s;
}
.pnav:hover{transform:scale(1.06);box-shadow:0 0 20px rgba(203,166,247,.45);}
.pnav:disabled{opacity:.22;cursor:not-allowed;transform:none;box-shadow:none;}
.ppages{
  background:rgba(49,50,68,.9);border:1px solid var(--bdr);
  color:var(--accent);padding:9px 14px;border-radius:9px;
  font-size:.82rem;min-width:80px;text-align:center;white-space:nowrap;
}

/* ── AUDIO PLAYER ── */
#audioPlayer{
  flex:1;min-height:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:40px 60px;background:var(--base);gap:32px;
}
.ap-art{
  width:min(320px,70vw);height:min(320px,70vw);border-radius:20px;
  overflow:hidden;flex-shrink:0;
  background:linear-gradient(145deg,var(--surface0),var(--mantle));
  box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 0 1px rgba(203,166,247,.1);
  position:relative;
}
.ap-art img{width:100%;height:100%;object-fit:cover;}
.ap-art-ph{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:5rem;opacity:.25;
}
.ap-art.spinning .ap-art-inner{animation:vinyl-spin 4s linear infinite;}
@keyframes vinyl-spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.ap-art-inner{width:100%;height:100%;position:relative;}

.ap-info{text-align:center;max-width:500px;}
.ap-name{font-family:var(--fd);font-size:1.8rem;letter-spacing:3px;color:var(--text);margin-bottom:6px;}
.ap-album{font-size:.75rem;color:var(--overlay1);}

.ap-audio-wrap{width:100%;max-width:520px;}
.ap-audio-wrap audio{
  width:100%;height:48px;border-radius:12px;outline:none;
  background:var(--mantle);
  /* Chromium audio controls dark mode */
  color-scheme: dark;
  accent-color: var(--accent);
}

/* ── VIDEO PLAYER ── */
#videoPlayer{
  flex:1;min-height:0;display:flex;flex-direction:column;
  background:#000;
}
/* ── Subtitles / captions — Arabic + Unicode fix ── */
::cue {
  font-family: 'Cairo', 'Segoe UI', 'Tahoma', 'Arial Unicode MS', Arial, sans-serif;
  font-size: 1.15em;
  font-weight: 600;
  color: #ffffff;
  background: rgba(0,0,0,0.72);
  text-shadow: 0 1px 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.8);
  line-height: 1.6;
  unicode-bidi: plaintext;
  direction: auto;
}
::cue(b) { font-weight: 800; color: var(--accent); }
::cue(i) { font-style: italic; color: var(--subtext1); }
.vp-wrap{
  flex:1;min-height:0;position:relative;background:#000;
  display:flex;align-items:center;justify-content:center;
  /* GPU compositing layer */
  transform: translateZ(0);
  will-change: transform;
}
.vp-wrap video{
  max-width:100%;max-height:100%;
  width:100%;height:100%;
  object-fit:contain;
  background:#000;
  /* Force GPU layer for video element */
  transform: translateZ(0);
  will-change: transform;
  /* Crisp pixel rendering */
  image-rendering: high-quality;
  -webkit-font-smoothing: antialiased;
}

/* ══ TOAST ══ */
#toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(10px);z-index:4000;
  background:rgba(69,71,90,.95);color:var(--text);
  border:1px solid var(--bdr);backdrop-filter:blur(14px);
  padding:10px 22px;border-radius:20px;font-size:.75rem;white-space:nowrap;
  opacity:0;pointer-events:none;transition:.3s;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- TITLEBAR -->
<div id="titlebar">
  <div class="win-btns">
    <button class="wb" id="wc"></button>
    <button class="wb" id="wm"></button>
    <button class="wb" id="wx"></button>
  </div>
  <div class="tb-logo">VAULT</div>
  <div class="tb-right">
    <input type="text" id="searchBar" class="tb-input" placeholder="🔍  Search artists / tracks…" style="display:none">
    <div id="filterRow" style="display:none">
      <button class="filter-btn on" data-type="all">All</button>
      <button class="filter-btn" data-type="audio">🎵 Sounds</button>
      <button class="filter-btn" data-type="clip">🎬 Clips</button>
    </div>
    <select id="sortSel" class="tb-sel" style="display:none">
      <option value="az">A → Z</option>
      <option value="za">Z → A</option>
      <option value="most">Most Tracks</option>
    </select>
    <button class="tb-btn" id="tb-change" style="display:none">⏏ Change</button>
    <button class="tb-btn" id="tb-fs">⛶</button>
    <div id="counter" style="display:none">0 artists</div>
  </div>
</div>

<!-- WELCOME -->
<div id="welcome">
  <div class="wbox">
    <div class="wbox-logo">MUSIC VAULT</div>
    <div class="wbox-sub">Catppuccin Mocha · Local Player</div>
    <div id="recentPaths"></div>
    <div class="dropzone" id="dropzone">
      <div id="dzMain">
        <div class="dz-icon">🎵</div>
        <div class="dz-label">Drop your music library folder</div>
        <div class="dz-hint">
          Sounds: M4A · MP3 · FLAC · WAV · OGG · OPUS · AAC<br>
          Clips: MP4 · MKV · AVI · WebM · and more
        </div>
        <div class="btn-row">
          <button class="btn-p" id="openBtn">Open Folder</button>
        </div>
      </div>
      <div id="loadState">
        <div class="load-msg" id="loadMsg">Scanning…</div>
        <div class="spinner"></div>
        <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
      </div>
    </div>
  </div>
</div>

<!-- LIBRARY (artist/genre grid) -->
<div class="app-screen" id="S-lib">
  <div class="lib-body">
    <div class="sec-label" id="libLabel">Artists</div>
    <div class="title-grid" id="titleGrid"></div>
  </div>
</div>

<!-- TRACK LIST -->
<div class="app-screen" id="S-ep">
  <div class="epbar">
    <div class="epbar-thumb"><img id="epCover" src="" alt=""></div>
    <div class="epbar-info">
      <div class="epbar-title" id="epTitle">—</div>
      <div class="epbar-sub" id="epSub">—</div>
    </div>
    <button class="tb-btn" id="epBackBtn">← Back</button>
    <button class="tb-btn" id="watchAllBtn">Play ▶</button>
  </div>
  <div class="ep-body">
    <div id="seasonsBar"></div>
    <div id="continueSlot"></div>
    <div id="epGrid"></div>
  </div>
</div>

<!-- PLAYER -->
<div class="app-screen" id="S-player">
  <div id="pbar">
    <button class="tb-btn" id="pBackBtn">← Back</button>
    <div class="ptitle" id="pTitle">—</div>
    <div class="pctrl">
      <button class="pnav" id="pPrev">◀ PREV</button>
      <button class="pnav" id="pNext">NEXT ▶</button>
      <div class="ppages" id="pPages">—</div>
    </div>
  </div>
  <!-- Audio player -->
  <div id="audioPlayer" style="display:none">
    <div class="ap-art" id="apArt">
      <div class="ap-art-inner" id="apArtInner">
        <div class="ap-art-ph" id="apArtPh">🎵</div>
        <img id="apArtImg" src="" alt="" style="display:none;width:100%;height:100%;object-fit:cover;position:absolute;inset:0;">
      </div>
    </div>
    <div class="ap-info">
      <div class="ap-name" id="apName">—</div>
      <div class="ap-album" id="apAlbum">—</div>
    </div>
    <div class="ap-audio-wrap">
      <audio id="apAudio" controls preload="auto" volume="1.0"></audio>
    </div>
  </div>
  <!-- Video player -->
  <div id="videoPlayer" style="display:none">
    <div class="vp-wrap">
      <video id="vpVideo" controls autoplay
        playsinline
        x-webkit-airplay="allow"
        webkit-playsinline="true">
      </video>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script src="renderer.js"></script>
</body>
</html>
