<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Image Vault</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Roboto+Mono:wght@300;400;500&display=swap');

:root {
  --bg:       #1a1b27;
  --bg2:      #16161e;
  --bg3:      #1f2035;
  --accent:   #bb9af7;
  --accent2:  #c0caf5;
  --red:      #f7768e;
  --green:    #9ece6a;
  --yellow:   #e0af68;
  --blue:     #7aa2f7;
  --cyan:     #7dcfff;
  --purple:   #9d7cd8;
  --comment:  #565f89;
  --gap:      10px;
  --hh:       62px;
  --font:     'Roboto Mono', monospace;
  --title:    'Orbitron', sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:var(--bg);color:var(--accent2);font-family:var(--font);overflow:hidden;user-select:none;}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(187,154,247,.35);border-radius:3px;}

/* ── PARTICLES ── */
#particles{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* ── TITLEBAR ── */
#titlebar{
  -webkit-app-region:drag;
  position:fixed;top:0;left:0;right:0;height:var(--hh);z-index:1000;
  display:flex;align-items:center;padding:0 18px;justify-content:space-between;
  background:rgba(22,22,30,.9);backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(187,154,247,.2);
}
#titlebar h1{
  font-family:var(--title);font-size:1.35em;letter-spacing:2px;
  background:linear-gradient(135deg,#bb9af7,#7dcfff,#bb9af7);
  background-size:200%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:gradShift 4s linear infinite;
}
@keyframes gradShift{to{background-position:200%;}}

.win-btns{display:flex;gap:7px;align-items:center;-webkit-app-region:no-drag;}
.win-btn{width:13px;height:13px;border-radius:50%;border:none;cursor:pointer;transition:transform .2s,opacity .2s;}
.win-btn:hover{transform:scale(1.2);}
#wClose{background:#f7768e;box-shadow:0 0 8px #f7768e88;}
#wMin{background:#e0af68;box-shadow:0 0 8px #e0af6888;}
#wMax{background:#9ece6a;box-shadow:0 0 8px #9ece6a88;}

.tb-right{display:flex;gap:9px;align-items:center;-webkit-app-region:no-drag;}
.tb-input{
  background:rgba(187,154,247,.1);border:1px solid rgba(187,154,247,.2);
  color:white;padding:6px 13px;border-radius:10px;font-size:12px;
  font-family:var(--font);transition:all .25s;
}
.tb-input:focus{outline:none;width:230px!important;box-shadow:0 0 18px rgba(187,154,247,.4);border-color:var(--accent);}
#searchBar{width:190px;}
.tb-btn{
  background:rgba(187,154,247,.1);border:1px solid rgba(187,154,247,.2);
  color:var(--accent2);padding:6px 13px;border-radius:10px;font-size:12px;
  font-family:var(--font);cursor:pointer;transition:all .25s;white-space:nowrap;
}
.tb-btn:hover{background:var(--accent);color:#1a1b27;box-shadow:0 0 16px rgba(187,154,247,.5);transform:translateY(-1px);}
.tb-btn.active{background:var(--accent);color:#1a1b27;}

#sortSelect{
  background:rgba(187,154,247,.1);border:1px solid rgba(187,154,247,.2);
  color:var(--accent2);padding:6px 10px;border-radius:10px;font-size:12px;
  font-family:var(--font);cursor:pointer;outline:none;
}
#sortSelect option{background:var(--bg2);}

#counter{
  background:rgba(187,154,247,.1);border:1px solid rgba(187,154,247,.2);
  color:var(--accent2);padding:6px 14px;border-radius:20px;font-size:12px;
  white-space:nowrap;min-width:90px;text-align:center;
}

/* ── WELCOME ── */
#welcome{
  position:fixed;inset:0;z-index:500;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#1a1b27,#16161e);
  transition:opacity .5s,visibility .5s;
}
#welcome.hidden{opacity:0;visibility:hidden;pointer-events:none;}

.wbox{
  width:90%;max-width:680px;
  background:rgba(26,27,39,.85);backdrop-filter:blur(24px);
  border:1.5px solid rgba(187,154,247,.3);border-radius:28px;
  padding:52px 44px;text-align:center;
  box-shadow:0 0 60px rgba(187,154,247,.15),0 30px 80px rgba(0,0,0,.6);
  animation:floatBox 6s ease-in-out infinite;
}
@keyframes floatBox{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}

.wbox h2{
  font-family:var(--title);font-size:2.8em;letter-spacing:3px;margin-bottom:10px;
  background:linear-gradient(135deg,#7dcfff,#bb9af7,#f7768e);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.wsub{color:var(--comment);font-size:.95em;margin-bottom:32px;}

.dropzone{
  border:2px dashed rgba(187,154,247,.4);border-radius:20px;padding:38px 20px;
  background:rgba(187,154,247,.05);cursor:pointer;transition:all .35s;
  animation:dzGlow 3s ease-in-out infinite;
}
.dropzone.over{border-color:var(--accent);background:rgba(187,154,247,.15);transform:scale(1.01);box-shadow:0 0 40px rgba(187,154,247,.4);}
@keyframes dzGlow{0%,100%{box-shadow:0 0 12px rgba(187,154,247,.15);}50%{box-shadow:0 0 30px rgba(187,154,247,.35);}}

.dz-icon{font-size:2.8em;margin-bottom:10px;}
.dz-label{color:var(--accent2);font-size:1em;margin-bottom:18px;}
.btn-row{display:flex;gap:12px;justify-content:center;}
.btn-p{
  padding:13px 36px;background:linear-gradient(135deg,#bb9af7,#9d7cd8);
  border:none;border-radius:40px;color:white;font-size:14px;font-family:var(--font);
  cursor:pointer;font-weight:600;letter-spacing:.5px;
  box-shadow:0 0 20px rgba(187,154,247,.4);transition:all .3s;
}
.btn-p:hover{transform:translateY(-3px);box-shadow:0 0 35px rgba(187,154,247,.6);}
.btn-s{
  padding:13px 36px;background:rgba(187,154,247,.1);border:1px solid rgba(187,154,247,.3);
  border-radius:40px;color:var(--accent2);font-size:14px;font-family:var(--font);
  cursor:pointer;transition:all .3s;
}
.btn-s:hover{background:rgba(187,154,247,.2);transform:translateY(-2px);}

#loadingState{display:none;text-align:center;padding:16px 0;}
.spinner{width:44px;height:44px;border:4px solid rgba(187,154,247,.15);border-top:4px solid var(--accent);border-radius:50%;animation:spin .85s linear infinite;margin:12px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.progress-bar{width:100%;height:4px;background:rgba(187,154,247,.12);border-radius:2px;margin-top:10px;overflow:hidden;}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--cyan));border-radius:2px;transition:width .2s;box-shadow:0 0 10px rgba(187,154,247,.5);}
.load-msg{color:var(--cyan);font-size:.9em;margin-bottom:4px;animation:blink 1.4s infinite;}
@keyframes blink{0%,100%{opacity:.4;}50%{opacity:1;}}

/* ── GALLERY ── */
#galleryWrap{
  position:fixed;top:var(--hh);bottom:0;left:0;right:0;
  overflow-y:scroll;overflow-x:hidden;
  opacity:0;transition:opacity .5s;
}
#galleryWrap.visible{opacity:1;}
#masonryGrid{position:relative;padding:var(--gap);}

/* ── MASONRY ITEM ── */
.m-item{
  position:absolute;border-radius:14px;overflow:hidden;cursor:pointer;
  border:1.5px solid transparent;background:var(--bg2);
  box-shadow:0 6px 20px rgba(0,0,0,.5);
  transition:transform .45s cubic-bezier(.23,1,.32,1),box-shadow .45s,border-color .35s;
}
.m-item:hover{
  transform:translateY(-9px) scale(1.035);
  box-shadow:0 0 30px rgba(187,154,247,.5),0 20px 50px rgba(0,0,0,.5);
  border-color:var(--accent);z-index:10;
}
.m-item img,.m-item video{
  width:100%;height:auto;display:block;border-radius:13px;
  transition:transform .5s ease;
}
.m-item:hover img,.m-item:hover video{transform:scale(1.07);}

.skeleton{
  width:100%;
  background:linear-gradient(90deg,rgba(187,154,247,.06) 25%,rgba(187,154,247,.13) 50%,rgba(187,154,247,.06) 75%);
  background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:13px;
}
@keyframes shimmer{to{background-position:-200% 0;}}

/* Favorite star */
.fav-btn{
  position:absolute;top:8px;right:8px;
  background:rgba(0,0,0,.55);border:none;border-radius:50%;
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  font-size:15px;cursor:pointer;opacity:0;
  transition:opacity .25s,transform .25s,box-shadow .25s;
  z-index:5;
}
.m-item:hover .fav-btn{opacity:1;}
.fav-btn.active{opacity:1;color:#e0af68;box-shadow:0 0 10px rgba(224,175,104,.6);}
.fav-btn:hover{transform:scale(1.2);}

/* video badge */
.vid-badge{
  position:absolute;bottom:8px;left:8px;
  background:rgba(0,0,0,.6);color:var(--cyan);
  font-size:10px;padding:3px 7px;border-radius:6px;
  border:1px solid rgba(125,207,255,.3);
  pointer-events:none;
}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(26,27,39,.95);border:1px solid rgba(187,154,247,.35);
  color:var(--accent2);padding:10px 22px;border-radius:12px;font-size:13px;
  z-index:9999;opacity:0;transition:all .35s;pointer-events:none;
  box-shadow:0 0 20px rgba(187,154,247,.25);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── LIGHTBOX ── */
#lightbox{
  position:fixed;inset:0;background:rgba(0,0,0,.97);
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:all .35s;z-index:2000;
}
#lightbox.active{opacity:1;visibility:visible;}

#lbInner{
  position:relative;display:flex;align-items:center;justify-content:center;
  width:100%;height:100%;
}

#lbImg,#lbVideo{
  max-width:88vw;max-height:86vh;border-radius:14px;
  object-fit:contain;
  box-shadow:0 0 60px rgba(187,154,247,.2),0 20px 60px rgba(0,0,0,.7);
  transition:transform .2s;
  cursor:zoom-in;
}
#lbImg.zoomed{
  max-width:none;max-height:none;
  cursor:zoom-out;
  border-radius:4px;
}

.lb-btn{
  position:absolute;background:rgba(26,27,39,.7);border:1px solid rgba(187,154,247,.3);
  color:white;border-radius:50%;width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;cursor:pointer;transition:all .25s;
  backdrop-filter:blur(10px);
}
.lb-btn:hover{background:var(--accent);color:#1a1b27;box-shadow:0 0 20px rgba(187,154,247,.5);}

#lbClose{top:20px;right:20px;font-size:16px;}
#lbPrev{left:20px;top:50%;transform:translateY(-50%);}
#lbNext{right:20px;top:50%;transform:translateY(-50%);}

#lbFav{
  top:20px;left:20px;font-size:16px;
  background:rgba(26,27,39,.7);border:1px solid rgba(187,154,247,.3);
}
#lbFav.active{border-color:#e0af68;box-shadow:0 0 14px rgba(224,175,104,.5);}

/* Lightbox bottom bar */
#lbBar{
  position:absolute;bottom:0;left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;
  background:linear-gradient(transparent,rgba(0,0,0,.8));
  gap:10px;
}
#lbInfo{color:rgba(255,255,255,.85);font-size:12px;flex:1;}
#lbInfo strong{color:white;display:block;margin-bottom:3px;font-size:13px;}
.lb-actions{display:flex;gap:8px;}
.lba-btn{
  background:rgba(187,154,247,.15);border:1px solid rgba(187,154,247,.25);
  color:var(--accent2);padding:6px 12px;border-radius:8px;font-size:11px;
  font-family:var(--font);cursor:pointer;transition:all .22s;
}
.lba-btn:hover{background:var(--accent);color:#1a1b27;}

/* Slideshow indicator */
#slideshowBar{
  position:absolute;top:0;left:0;right:0;height:3px;
  background:rgba(187,154,247,.15);overflow:hidden;
  opacity:0;transition:opacity .3s;
}
#slideshowBar.active{opacity:1;}
#slideshowProgress{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--cyan));transition:none;}
</style>
</head>
<body>

<canvas id="particles"></canvas>

<!-- TITLEBAR -->
<div id="titlebar">
  <div class="win-btns">
    <button class="win-btn" id="wClose"></button>
    <button class="win-btn" id="wMin"></button>
    <button class="win-btn" id="wMax"></button>
  </div>
  <h1>IMAGE VAULT</h1>
  <div class="tb-right">
    <input type="text" id="searchBar" class="tb-input" placeholder="🔍 Search…">
    <select id="sortSelect">
      <option value="name">Sort: Name</option>
      <option value="date">Sort: Date</option>
      <option value="size">Sort: Size</option>
      <option value="favs">Sort: Favorites</option>
    </select>
    <button class="tb-btn" id="favsBtn">⭐ Favorites</button>
    <button class="tb-btn" id="slideshowBtn">▶ Slideshow</button>
    <button class="tb-btn" id="fsBtn">⛶ Fullscreen</button>
    <button class="tb-btn" id="changeBtn">⏏ Change</button>
    <div id="counter">0 images</div>
  </div>
</div>

<!-- WELCOME -->
<div id="welcome">
  <div class="wbox">
    <h2>IMAGE VAULT</h2>
    <p class="wsub">Local vault · Fast · No memory overload</p>
    <div class="dropzone" id="dropzone">
      <div id="dzMain">
        <div class="dz-icon">🌸</div>
        <div class="dz-label">Drop a folder or images here</div>
        <div class="btn-row">
          <button class="btn-p" id="openFolderBtn">Open Folder</button>
          <button class="btn-s" id="openFilesBtn">Select Files</button>
        </div>
      </div>
      <div id="loadingState">
        <div class="load-msg" id="loadMsg">Scanning…</div>
        <div class="spinner"></div>
        <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
        <div style="margin-top:7px;font-size:.8em;color:var(--comment);" id="progText">0%</div>
      </div>
    </div>
  </div>
</div>

<!-- GALLERY -->
<div id="galleryWrap">
  <div id="masonryGrid"></div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <div id="slideshowBar"><div id="slideshowProgress"></div></div>
  <div id="lbInner">
    <button class="lb-btn" id="lbClose">✕</button>
    <button class="lb-btn" id="lbFav" title="Favorite">☆</button>
    <button class="lb-btn" id="lbPrev">‹</button>
    <img id="lbImg" src="" alt="" style="display:none;">
    <video id="lbVideo" src="" controls loop style="display:none;"></video>
    <button class="lb-btn" id="lbNext">›</button>
    <div id="lbBar">
      <div id="lbInfo"></div>
      <div class="lb-actions">
        <button class="lba-btn" id="lbCopyPath">📋 Copy Path</button>
        <button class="lba-btn" id="lbOpenFolder">📂 Show in Folder</button>
      </div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script src="renderer.js"></script>
</body>
</html>
