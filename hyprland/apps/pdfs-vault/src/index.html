<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PDFs Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --base:#1e1e2e;--mantle:#181825;--crust:#11111b;
  --surface0:#313244;--surface1:#45475a;--surface2:#585b70;
  --overlay0:#6c7086;--overlay1:#7f849c;--overlay2:#9399b2;
  --text:#cdd6f4;--subtext0:#a6adc8;--subtext1:#bac2de;
  --lavender:#b4befe;--blue:#89b4fa;--sapphire:#74c7ec;
  --sky:#89dceb;--teal:#94e2d5;--green:#a6e3a1;
  --yellow:#f9e2af;--peach:#fab387;--red:#f38ba8;
  --maroon:#eba0ac;--pink:#f5c2e7;--mauve:#cba6f7;
  --bdr:rgba(108,112,134,.28);--glow:rgba(203,166,247,.18);
  --hh:66px;
  --fd:'Bebas Neue',sans-serif;--fm:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.4,0,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:var(--base);color:var(--text);font-family:var(--fm);overflow:hidden;user-select:none;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--surface1);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--mauve);}

/* ══ TITLEBAR ══ */
#titlebar{
  -webkit-app-region:drag;
  position:fixed;top:0;left:0;right:0;height:var(--hh);z-index:1000;
  display:flex;align-items:center;padding:0 22px;gap:16px;
  background:rgba(17,17,27,.97);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bdr);
}
#titlebar::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1.5px;
  background:linear-gradient(90deg,transparent,var(--mauve),var(--pink),transparent);
  opacity:.5;
}
.win-btns{display:flex;gap:8px;-webkit-app-region:no-drag;flex-shrink:0;}
.wb{width:14px;height:14px;border-radius:50%;border:none;cursor:pointer;transition:all .2s;}
.wb:hover{transform:scale(1.25);}
#wc{background:#f38ba8;box-shadow:0 0 8px rgba(243,139,168,.5);}
#wm{background:#f9e2af;box-shadow:0 0 8px rgba(249,226,175,.5);}
#wx{background:#a6e3a1;box-shadow:0 0 8px rgba(166,227,161,.5);}

.tb-logo{
  font-family:var(--fd);font-size:1.9rem;letter-spacing:5px;flex-shrink:0;
  background:linear-gradient(135deg,var(--mauve),var(--pink));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  -webkit-app-region:drag;
}
.tb-right{flex:1;display:flex;align-items:center;gap:10px;justify-content:flex-end;-webkit-app-region:no-drag;}

.tb-input{
  background:rgba(49,50,68,.8);border:1px solid var(--bdr);color:var(--text);
  padding:9px 15px;border-radius:9px;font-size:14px;font-family:var(--fm);
  outline:none;width:220px;transition:.3s;
}
.tb-input:focus{border-color:var(--mauve);width:300px;box-shadow:0 0 14px var(--glow);}
.tb-input::placeholder{color:var(--overlay0);}

.tb-btn{
  -webkit-app-region:no-drag;
  background:rgba(49,50,68,.8);border:1px solid var(--bdr);color:var(--text);
  padding:9px 16px;border-radius:9px;font-size:14px;font-family:var(--fm);
  cursor:pointer;transition:all .2s var(--ease);white-space:nowrap;
}
.tb-btn:hover{background:var(--mauve);color:var(--crust);border-color:var(--mauve);}
.tb-btn.on{background:rgba(203,166,247,.15);border-color:rgba(203,166,247,.35);color:var(--mauve);}
.tb-sel{
  background:rgba(49,50,68,.8);border:1px solid var(--bdr);color:var(--text);
  padding:9px 11px;border-radius:9px;font-size:14px;font-family:var(--fm);cursor:pointer;outline:none;
}
.tb-sel option{background:var(--mantle);}
#counter{
  background:rgba(49,50,68,.8);border:1px solid var(--bdr);
  color:var(--mauve);padding:9px 16px;border-radius:20px;
  font-size:13px;white-space:nowrap;min-width:90px;text-align:center;
}

/* ══ WELCOME ══ */
#welcome{
  position:fixed;inset:0;z-index:500;
  display:flex;align-items:center;justify-content:center;
  background:var(--crust);transition:opacity .4s,visibility .4s;
}
#welcome::before{
  content:'';position:absolute;inset:-50%;pointer-events:none;
  background:linear-gradient(rgba(203,166,247,.04) 1px,transparent 1px),
             linear-gradient(90deg,rgba(203,166,247,.04) 1px,transparent 1px);
  background-size:40px 40px;animation:gridDrift 24s linear infinite;
}
#welcome::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 55% 45% at 25% 35%,rgba(203,166,247,.07),transparent),
             radial-gradient(ellipse 45% 55% at 75% 65%,rgba(245,194,231,.06),transparent);
}
@keyframes gridDrift{to{transform:translate(40px,40px);}}
#welcome.hidden{opacity:0;visibility:hidden;pointer-events:none;}

.wbox{
  position:relative;z-index:1;width:min(680px,88vw);
  background:rgba(24,24,37,.88);backdrop-filter:blur(28px);
  border:1px solid rgba(203,166,247,.2);border-radius:28px;
  padding:52px 48px;text-align:center;
  box-shadow:0 0 60px rgba(203,166,247,.1),0 32px 80px rgba(0,0,0,.6);
}
.wbox-logo{
  font-family:var(--fd);font-size:clamp(3.2rem,6.5vw,5rem);letter-spacing:9px;line-height:1;
  background:linear-gradient(135deg,var(--mauve),var(--pink) 50%,var(--lavender));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 28px rgba(203,166,247,.22));margin-bottom:8px;
}
.wbox-sub{
  font-size:.72rem;letter-spacing:6px;color:var(--overlay1);text-transform:uppercase;
  margin-bottom:36px;
  display:flex;align-items:center;justify-content:center;gap:12px;
}
.wbox-sub::before,.wbox-sub::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--bdr),transparent);}

#recentPaths{margin-bottom:20px;display:flex;flex-direction:column;gap:8px;}
.recent-item{
  background:rgba(49,50,68,.4);border:1px solid var(--bdr);border-radius:10px;
  padding:11px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;
  transition:all .2s;text-align:left;
}
.recent-item:hover{border-color:var(--mauve);background:rgba(203,166,247,.08);}
.recent-icon{font-size:1.1rem;flex-shrink:0;}
.recent-info{flex:1;min-width:0;}
.recent-name{font-size:.85rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.recent-path{font-size:.62rem;color:var(--overlay0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.recent-arrow{color:var(--mauve);font-size:1rem;flex-shrink:0;}

.dropzone{
  border:1.5px dashed rgba(203,166,247,.25);border-radius:18px;
  padding:32px 24px;background:rgba(49,50,68,.2);
  cursor:pointer;transition:all .3s;
}
.dropzone:hover,.dropzone.over{
  border-color:var(--mauve);background:rgba(203,166,247,.07);
  box-shadow:0 0 30px rgba(203,166,247,.12);
}
.dz-icon{font-size:2.5rem;margin-bottom:10px;}
.dz-label{color:var(--subtext0);font-size:1rem;margin-bottom:20px;}
.btn-row{display:flex;gap:12px;justify-content:center;}
.btn-p{
  padding:13px 38px;
  background:linear-gradient(135deg,var(--mauve),var(--pink));
  border:none;border-radius:40px;color:var(--crust);
  font-size:15px;font-family:var(--fm);font-weight:600;
  cursor:pointer;transition:all .3s;box-shadow:0 0 20px rgba(203,166,247,.3);
}
.btn-p:hover{transform:translateY(-3px);box-shadow:0 0 34px rgba(203,166,247,.55);}

/* loading */
#loadState{display:none;padding:16px 0;}
.spinner{width:42px;height:42px;border:3px solid rgba(203,166,247,.15);border-top-color:var(--mauve);border-radius:50%;animation:spin .8s linear infinite;margin:10px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.prog-bar{width:100%;height:3px;background:rgba(203,166,247,.1);border-radius:2px;margin-top:14px;overflow:hidden;}
.prog-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--mauve),var(--pink));border-radius:2px;transition:width .2s;}
.load-msg{color:var(--sapphire);font-size:.88rem;margin-bottom:6px;}

/* ══ APP SCREENS ══ */
.app-screen{
  position:fixed;top:var(--hh);bottom:0;left:0;right:0;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .3s var(--ease),visibility .3s;
}
.app-screen.vis{opacity:1;visibility:visible;pointer-events:auto;}

/* ══ BROWSE (folder tree screen) ══ */
#S-browse{display:flex;flex-direction:column;overflow:hidden;background:var(--base);}
.crumbbar{
  flex-shrink:0;padding:14px 28px;
  background:rgba(24,24,37,.95);border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.crumb{
  font-size:.82rem;color:var(--overlay1);cursor:pointer;padding:5px 10px;border-radius:7px;
  transition:.15s;white-space:nowrap;
}
.crumb:hover{background:rgba(203,166,247,.12);color:var(--mauve);}
.crumb.last{color:var(--mauve);font-weight:600;cursor:default;}
.crumb.last:hover{background:none;}
.crumb-sep{color:var(--overlay0);font-size:.75rem;}

.browse-body{flex:1;min-height:0;overflow-y:auto;padding:26px 30px;}
.sec-label{
  font-family:var(--fd);font-size:1.1rem;letter-spacing:5px;color:var(--overlay1);
  text-transform:uppercase;margin-bottom:22px;
  display:flex;align-items:center;gap:12px;
}
.sec-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--bdr),transparent);}

.item-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:18px;
}

/* folder card */
.fcard{
  background:var(--mantle);border:1px solid var(--bdr);border-radius:16px;
  overflow:hidden;cursor:pointer;transition:all .25s var(--spring);position:relative;
  padding:20px;display:flex;flex-direction:column;gap:10px;
}
.fcard:hover{
  border-color:var(--mauve);transform:translateY(-5px) scale(1.01);
  box-shadow:0 18px 40px rgba(0,0,0,.55),0 0 0 1px rgba(203,166,247,.15),0 0 26px rgba(203,166,247,.08);
}
.fcard-top{display:flex;align-items:center;gap:12px;}
.fcard-icon{font-size:1.9rem;flex-shrink:0;}
.fcard-name{font-size:.95rem;font-weight:600;color:var(--text);line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.fcard-meta{display:flex;align-items:center;justify-content:space-between;margin-top:auto;}
.fcard-count{font-size:.7rem;color:var(--overlay1);}
.fcard-prog{height:3px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden;}
.fcard-prog-f{height:100%;background:linear-gradient(90deg,var(--mauve),var(--pink));transition:width .4s;}
.fpill{font-size:.62rem;padding:3px 9px;border-radius:10px;}
.fpill.fresh{background:rgba(137,180,250,.08);color:var(--blue);border:1px solid rgba(137,180,250,.15);}
.fpill.wip{background:rgba(203,166,247,.1);color:var(--mauve);border:1px solid rgba(203,166,247,.15);}
.fpill.done{background:rgba(166,227,161,.1);color:var(--green);border:1px solid rgba(166,227,161,.2);}

/* pdf card */
.pcard{
  background:rgba(49,50,68,.45);border:1px solid var(--bdr);border-radius:13px;
  padding:16px;cursor:pointer;transition:all .2s var(--spring);position:relative;
  display:flex;align-items:flex-start;gap:12px;
}
.pcard:hover{background:rgba(203,166,247,.1);border-color:var(--mauve);transform:scale(1.015);box-shadow:0 8px 22px rgba(203,166,247,.18);}
.pcard.read{border-color:rgba(166,227,161,.25);}
.pcard-icon{font-size:1.5rem;flex-shrink:0;color:var(--red);}
.pcard-info{flex:1;min-width:0;}
.pcard-name{font-size:.84rem;font-weight:600;color:var(--text);line-height:1.35;word-break:break-word;}
.pcard-meta{font-size:.66rem;color:var(--overlay0);margin-top:5px;}
.pcard-dot{position:absolute;top:10px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--green);}
.pcard-star{position:absolute;bottom:10px;right:10px;font-size:.95rem;color:var(--overlay0);cursor:pointer;transition:.15s;z-index:2;}
.pcard-star:hover{transform:scale(1.2);}
.pcard-star.on{color:var(--yellow);}

.empty-hint{color:var(--overlay0);font-size:.85rem;text-align:center;padding:60px 20px;}

/* ══ READER ══ */
#S-read{display:flex;flex-direction:column;overflow:hidden;background:var(--crust);}
.rbar{
  flex-shrink:0;height:66px;padding:0 20px;
  background:rgba(17,17,27,.97);border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;gap:10px;
  transition:opacity .3s;position:relative;z-index:20;
}
.rbar::after{
  content:'';position:absolute;top:0;left:0;right:0;height:1.5px;
  background:linear-gradient(90deg,transparent,var(--mauve),var(--pink),transparent);opacity:.35;
}
.rtitle{flex:1;min-width:0;font-family:var(--fd);font-size:1.1rem;letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rctrl{display:flex;align-items:center;gap:9px;flex-shrink:0;}
.rnav{
  background:linear-gradient(135deg,var(--mauve),var(--pink));
  border:none;color:var(--crust);
  padding:10px 20px;border-radius:9px;cursor:pointer;
  font-size:.85rem;font-weight:700;font-family:var(--fm);transition:all .2s;
}
.rnav:hover{transform:scale(1.06);box-shadow:0 0 20px rgba(203,166,247,.45);}
.rnav:disabled{opacity:.22;cursor:not-allowed;transform:none;box-shadow:none;}
.rmeta{
  background:rgba(49,50,68,.9);border:1px solid var(--bdr);
  color:var(--mauve);padding:9px 14px;border-radius:9px;
  font-size:.78rem;min-width:60px;text-align:center;white-space:nowrap;cursor:pointer;
}
.rmeta:hover{border-color:var(--mauve);}
.pdf-frame{width:100%;height:100%;border:none;background:var(--crust);}

/* ══ SEARCH RESULTS ══ */
.sres-item{
  background:rgba(49,50,68,.4);border:1px solid var(--bdr);border-radius:12px;
  padding:14px 18px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:14px;margin-bottom:9px;
}
.sres-item:hover{border-color:var(--mauve);background:rgba(203,166,247,.08);}
.sres-icon{font-size:1.3rem;color:var(--red);flex-shrink:0;}
.sres-info{flex:1;min-width:0;}
.sres-name{font-size:.86rem;font-weight:600;color:var(--text);}
.sres-path{font-size:.68rem;color:var(--overlay0);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ══ TOAST ══ */
#toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(10px);z-index:4000;
  background:rgba(69,71,90,.95);color:var(--text);
  border:1px solid var(--bdr);backdrop-filter:blur(14px);
  padding:10px 22px;border-radius:20px;font-size:.75rem;white-space:nowrap;
  opacity:0;pointer-events:none;transition:.3s;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- TITLEBAR -->
<div id="titlebar">
  <div class="win-btns">
    <button class="wb" id="wc"></button>
    <button class="wb" id="wm"></button>
    <button class="wb" id="wx"></button>
  </div>
  <div class="tb-logo">VAULT</div>
  <div class="tb-right">
    <input type="text" id="searchBar" class="tb-input" placeholder="🔍  Search all PDFs…" style="display:none">
    <button class="tb-btn" id="starredBtn" style="display:none">★ Starred</button>
    <button class="tb-btn" id="tb-change" style="display:none">⏏ Change</button>
    <button class="tb-btn" id="tb-fs">⛶</button>
    <div id="counter" style="display:none">0 PDFs</div>
  </div>
</div>

<!-- WELCOME -->
<div id="welcome">
  <div class="wbox">
    <div class="wbox-logo">PDFs VAULT</div>
    <div class="wbox-sub">Catppuccin Mocha · Local PDF Library</div>

    <div id="recentPaths"></div>

    <div class="dropzone" id="dropzone">
      <div id="dzMain">
        <div class="dz-icon">📚</div>
        <div class="dz-label">Drop your PDFs folder here</div>
        <div class="btn-row">
          <button class="btn-p" id="openBtn">Open Folder</button>
        </div>
      </div>
      <div id="loadState">
        <div class="load-msg" id="loadMsg">Scanning…</div>
        <div class="spinner"></div>
        <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
      </div>
    </div>
  </div>
</div>

<!-- BROWSE (tree navigation) -->
<div class="app-screen" id="S-browse">
  <div class="crumbbar" id="crumbBar"></div>
  <div class="browse-body" id="browseBody">
    <div class="sec-label" id="browseLabel">Library</div>
    <div class="item-grid" id="itemGrid"></div>
  </div>
</div>

<!-- READER -->
<div class="app-screen" id="S-read">
  <div class="rbar" id="rbar">
    <button class="tb-btn" id="rBackBtn">← Back</button>
    <div class="rtitle" id="rTitle">—</div>
    <div class="rctrl">
      <button class="rnav" id="rPrev">◀ PREV</button>
      <button class="rnav" id="rNext">NEXT ▶</button>
      <div class="rmeta" id="rStar" title="Toggle star">☆</div>
      <div class="rmeta" id="rShowFolder" title="Show in file manager">📁</div>
    </div>
  </div>
  <iframe class="pdf-frame" id="pdfFrame" src="" title="PDF"></iframe>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script src="renderer.js"></script>
</body>
</html>
