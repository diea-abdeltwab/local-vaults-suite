<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Video Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@300;400;600&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --base:#1e1e2e;--mantle:#181825;--crust:#11111b;
  --surface0:#313244;--surface1:#45475a;--surface2:#585b70;
  --overlay0:#6c7086;--overlay1:#7f849c;--overlay2:#9399b2;
  --text:#cdd6f4;--subtext0:#a6adc8;--subtext1:#bac2de;
  --lavender:#b4befe;--blue:#89b4fa;--sapphire:#74c7ec;
  --sky:#89dceb;--teal:#94e2d5;--green:#a6e3a1;
  --yellow:#f9e2af;--peach:#fab387;--red:#f38ba8;
  --maroon:#eba0ac;--pink:#f5c2e7;--mauve:#cba6f7;
  /* Video Vault accent: sky blue */
  --accent:#89dceb;--accent2:#74c7ec;--accentGlow:rgba(137,220,235,.18);
  --bdr:rgba(108,112,134,.28);
  --hh:66px;
  --fd:'Bebas Neue',sans-serif;--fm:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.4,0,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:var(--base);color:var(--text);font-family:var(--fm);overflow:hidden;user-select:none;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--surface1);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--accent);}

/* ══ TITLEBAR ══ */
#titlebar{
  -webkit-app-region:drag;
  position:fixed;top:0;left:0;right:0;height:var(--hh);z-index:1000;
  display:flex;align-items:center;padding:0 22px;gap:16px;
  background:rgba(17,17,27,.97);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bdr);
}
#titlebar::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1.5px;
  background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent);
  opacity:.5;
}
.win-btns{display:flex;gap:8px;-webkit-app-region:no-drag;flex-shrink:0;}
.wb{width:14px;height:14px;border-radius:50%;border:none;cursor:pointer;transition:all .2s;}
.wb:hover{transform:scale(1.25);}
#wc{background:#f38ba8;box-shadow:0 0 8px rgba(243,139,168,.5);}
#wm{background:#f9e2af;box-shadow:0 0 8px rgba(249,226,175,.5);}
#wx{background:#a6e3a1;box-shadow:0 0 8px rgba(166,227,161,.5);}

.tb-logo{
  font-family:var(--fd);font-size:1.9rem;letter-spacing:5px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  -webkit-app-region:drag;
}
.tb-right{flex:1;display:flex;align-items:center;gap:10px;justify-content:flex-end;-webkit-app-region:no-drag;}
.tb-input{
  background:rgba(49,50,68,.8);border:1px solid var(--bdr);color:var(--text);
  padding:9px 15px;border-radius:9px;font-size:14px;font-family:var(--fm);
  outline:none;width:210px;transition:.3s;
}
.tb-input:focus{border-color:var(--accent);width:260px;box-shadow:0 0 14px var(--accentGlow);}
.tb-input::placeholder{color:var(--overlay0);}
.tb-btn{
  -webkit-app-region:no-drag;
  background:rgba(49,50,68,.8);border:1px solid var(--bdr);color:var(--text);
  padding:9px 16px;border-radius:9px;font-size:14px;font-family:var(--fm);
  cursor:pointer;transition:all .2s var(--ease);white-space:nowrap;
}
.tb-btn:hover{background:var(--accent);color:var(--crust);border-color:var(--accent);}
.tb-sel{
  background:rgba(49,50,68,.8);border:1px solid var(--bdr);color:var(--text);
  padding:9px 11px;border-radius:9px;font-size:14px;font-family:var(--fm);cursor:pointer;outline:none;
}
.tb-sel option{background:var(--mantle);}
#counter{
  background:rgba(49,50,68,.8);border:1px solid var(--bdr);
  color:var(--accent);padding:9px 16px;border-radius:20px;
  font-size:13px;white-space:nowrap;min-width:90px;text-align:center;
}

/* ══ WELCOME ══ */
#welcome{
  position:fixed;inset:0;z-index:500;
  display:flex;align-items:center;justify-content:center;
  background:var(--crust);transition:opacity .4s,visibility .4s;
}
#welcome::before{
  content:'';position:absolute;inset:-50%;pointer-events:none;
  background:linear-gradient(rgba(137,220,235,.04) 1px,transparent 1px),
             linear-gradient(90deg,rgba(137,220,235,.04) 1px,transparent 1px);
  background-size:40px 40px;animation:gridDrift 24s linear infinite;
}
#welcome::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 55% 45% at 25% 35%,rgba(137,220,235,.07),transparent),
             radial-gradient(ellipse 45% 55% at 75% 65%,rgba(116,199,236,.06),transparent);
}
@keyframes gridDrift{to{transform:translate(40px,40px);}}
#welcome.hidden{opacity:0;visibility:hidden;pointer-events:none;}

.wbox{
  position:relative;z-index:1;width:min(700px,88vw);
  background:rgba(24,24,37,.88);backdrop-filter:blur(28px);
  border:1px solid rgba(137,220,235,.2);border-radius:28px;
  padding:52px 48px;text-align:center;
  box-shadow:0 0 60px rgba(137,220,235,.1),0 32px 80px rgba(0,0,0,.6);
}
.wbox-logo{
  font-family:var(--fd);font-size:clamp(3.5rem,7vw,5.5rem);letter-spacing:10px;line-height:1;
  background:linear-gradient(135deg,var(--accent),var(--accent2) 50%,var(--lavender));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 28px rgba(137,220,235,.22));margin-bottom:8px;
}
.wbox-sub{
  font-size:.72rem;letter-spacing:6px;color:var(--overlay1);text-transform:uppercase;
  margin-bottom:36px;
  display:flex;align-items:center;justify-content:center;gap:12px;
}
.wbox-sub::before,.wbox-sub::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--bdr),transparent);}

#recentPaths{margin-bottom:20px;display:flex;flex-direction:column;gap:8px;}
.recent-item{
  background:rgba(49,50,68,.4);border:1px solid var(--bdr);border-radius:10px;
  padding:11px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;
  transition:all .2s;text-align:left;
}
.recent-item:hover{border-color:var(--accent);background:rgba(137,220,235,.08);}
.recent-icon{font-size:1.1rem;flex-shrink:0;}
.recent-info{flex:1;min-width:0;}
.recent-name{font-size:.85rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.recent-path{font-size:.62rem;color:var(--overlay0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.recent-arrow{color:var(--accent);font-size:1rem;flex-shrink:0;}

.dropzone{
  border:1.5px dashed rgba(137,220,235,.25);border-radius:18px;
  padding:32px 24px;background:rgba(49,50,68,.2);
  cursor:pointer;transition:all .3s;
}
.dropzone:hover,.dropzone.over{
  border-color:var(--accent);background:rgba(137,220,235,.07);
  box-shadow:0 0 30px rgba(137,220,235,.12);
}
.dz-icon{font-size:2.5rem;margin-bottom:10px;}
.dz-label{color:var(--subtext0);font-size:1rem;margin-bottom:20px;}
.dz-hint{color:var(--overlay0);font-size:.72rem;margin-bottom:20px;line-height:1.6;}
.btn-row{display:flex;gap:12px;justify-content:center;}
.btn-p{
  padding:13px 38px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;border-radius:40px;color:var(--crust);
  font-size:15px;font-family:var(--fm);font-weight:600;
  cursor:pointer;transition:all .3s;box-shadow:0 0 20px rgba(137,220,235,.3);
}
.btn-p:hover{transform:translateY(-3px);box-shadow:0 0 34px rgba(137,220,235,.55);}

#loadState{display:none;padding:16px 0;}
.spinner{width:42px;height:42px;border:3px solid rgba(137,220,235,.15);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:10px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.prog-bar{width:100%;height:3px;background:rgba(137,220,235,.1);border-radius:2px;margin-top:14px;overflow:hidden;}
.prog-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .2s;}
.load-msg{color:var(--sapphire);font-size:.88rem;margin-bottom:6px;}

/* ══ APP SCREENS ══ */
.app-screen{
  position:fixed;top:var(--hh);bottom:0;left:0;right:0;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .3s var(--ease),visibility .3s;
}
.app-screen.vis{opacity:1;visibility:visible;pointer-events:auto;}

/* ══ LIBRARY ══ */
#S-lib{display:flex;flex-direction:column;overflow:hidden;background:var(--base);}
.lib-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:28px 32px;}
.sec-label{
  font-family:var(--fd);font-size:1.1rem;letter-spacing:5px;color:var(--overlay1);
  text-transform:uppercase;margin-bottom:24px;
  display:flex;align-items:center;gap:12px;
}
.sec-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--bdr),transparent);}

/* ── 5 fixed columns ── */
.title-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:22px;
}

.tcard{
  background:var(--mantle);border:1px solid var(--bdr);border-radius:16px;
  overflow:hidden;cursor:pointer;transition:all .3s var(--spring);position:relative;
}
.tcard:hover{
  border-color:var(--accent);
  transform:translateY(-10px) scale(1.02);
  box-shadow:0 28px 60px rgba(0,0,0,.7),0 0 0 1px rgba(137,220,235,.18),0 0 36px rgba(137,220,235,.1);
}
.tcard:hover .tcover-img{transform:scale(1.08);}
.tcard:hover .toverlay{opacity:1;}

/* Taller 16:9 thumb */
.tcover{
  width:100%;aspect-ratio:16/9;
  background:linear-gradient(145deg,var(--surface0),var(--mantle));
  overflow:hidden;position:relative;
}
.tcover-img{
  width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease);
  image-rendering:high-quality;
}
.tcover-ph{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  font-size:3.2rem;color:var(--accent);opacity:.3;
}
.toverlay{
  position:absolute;inset:0;opacity:0;transition:opacity .3s;
  background:linear-gradient(to top,rgba(17,17,27,.92) 0%,rgba(17,17,27,.25) 55%,transparent 80%);
  display:flex;align-items:flex-end;padding:14px;
}
.toverlay span{font-family:var(--fd);font-size:1rem;letter-spacing:4px;color:var(--accent);}
.tbadge{
  position:absolute;top:10px;right:10px;
  background:rgba(11,11,27,.85);backdrop-filter:blur(10px);
  color:var(--accent);border:1px solid rgba(137,220,235,.3);
  font-size:.66rem;padding:5px 12px;border-radius:20px;font-weight:600;
}
.tprog{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.06);}
.tprog-f{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s;}

/* Info section */
.tinfo{padding:14px 16px 16px;background:linear-gradient(180deg,var(--mantle),rgba(24,24,37,.98));}
.tname{font-size:.95rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:7px;}
.tmeta{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.tmeta-l{font-size:.72rem;color:var(--overlay1);}
.mpill{font-size:.65rem;padding:3px 9px;border-radius:10px;}
.mpill.has-groups{background:rgba(137,220,235,.1);color:var(--accent);border:1px solid rgba(137,220,235,.25);}
.mpill.flat{background:rgba(116,199,236,.07);color:var(--sapphire);border:1px solid rgba(116,199,236,.2);}

/* ══ VIDEO LIST ══ */
#S-ep{display:flex;flex-direction:column;overflow:hidden;background:var(--base);}
.epbar{
  flex-shrink:0;padding:16px 24px;
  background:rgba(24,24,37,.95);border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;gap:14px;
}
.epbar-thumb{
  width:96px;height:54px;border-radius:8px;overflow:hidden;flex-shrink:0;
  background:linear-gradient(145deg,var(--surface0),var(--mantle));
}
.epbar-thumb img{width:100%;height:100%;object-fit:cover;}
.epbar-info{flex:1;min-width:0;}
.epbar-title{font-family:var(--fd);font-size:1.5rem;letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.epbar-sub{font-size:.72rem;color:var(--overlay0);margin-top:3px;}
.ep-body{flex:1;min-height:0;overflow-y:auto;padding:20px 26px;}

/* group tabs */
#groupsBar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.group-btn{
  background:rgba(49,50,68,.5);border:1px solid var(--bdr);color:var(--subtext0);
  padding:6px 15px;border-radius:20px;font-size:.68rem;font-family:var(--fm);cursor:pointer;transition:.2s;
  max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.group-btn:hover{border-color:var(--accent);color:var(--accent);}
.group-btn.on{background:rgba(137,220,235,.12);border-color:var(--accent);color:var(--accent);}

.continue-wrap{
  margin-bottom:20px;
  background:linear-gradient(135deg,rgba(137,220,235,.1),rgba(116,199,236,.06));
  border:1px solid rgba(137,220,235,.2);border-radius:14px;
  padding:16px 20px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:.2s;
}
.continue-wrap:hover{border-color:var(--accent);background:rgba(137,220,235,.13);}
.continue-icon{font-size:1.8rem;}
.continue-info{flex:1;}
.continue-lbl{font-size:.68rem;color:var(--overlay1);margin-bottom:3px;}
.continue-ch{font-family:var(--fd);font-size:1.1rem;letter-spacing:2px;color:var(--accent);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.continue-arrow{color:var(--accent);font-size:1.3rem;}

/* YouTube-style video grid */
.video-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:14px;
}
.vcard{
  background:var(--mantle);border:1px solid var(--bdr);border-radius:12px;
  overflow:hidden;cursor:pointer;transition:all .25s var(--spring);position:relative;
}
.vcard:hover{
  border-color:var(--accent);transform:translateY(-6px) scale(1.02);
  box-shadow:0 20px 48px rgba(0,0,0,.6),0 0 24px rgba(137,220,235,.12);
}
.vcard:hover .vc-thumb-img{transform:scale(1.08);}
.vcard:hover .vc-play{opacity:1;}
.vcard.watched{border-color:rgba(166,227,161,.2);}
.vcard.playing{border-color:var(--accent);box-shadow:0 0 0 2px rgba(137,220,235,.35);}

/* 16:9 thumbnail — taller min-height so frame is clearly visible */
.vc-thumb{
  width:100%;aspect-ratio:16/9;min-height:110px;
  background:linear-gradient(145deg,var(--surface0),var(--mantle));
  overflow:hidden;position:relative;
}
.vc-thumb-img{
  width:100%;height:100%;object-fit:cover;
  transition:transform .4s var(--ease);
  image-rendering:high-quality;
}
/* spinner shown while extracting thumb */
.vc-thumb-loading{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--mantle);
}
.vc-thumb-spinner{
  width:24px;height:24px;border:2px solid rgba(137,220,235,.15);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .7s linear infinite;
}
.vc-thumb-ph{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:2.4rem;color:var(--accent);opacity:.25;
}
.vc-play{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .2s;
  background:rgba(17,17,27,.42);
}
.vc-play-btn{
  width:52px;height:52px;border-radius:50%;border:2px solid var(--accent);
  background:rgba(137,220,235,.18);display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;color:var(--accent);
  box-shadow:0 0 20px rgba(137,220,235,.3);
}
.vc-eq-overlay{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:3px;
  background:rgba(17,17,27,.5);
}
.vc-eq-bar{
  width:4px;border-radius:2px;background:var(--accent);
  animation:eqBounce .6s ease-in-out infinite alternate;
}
.vc-eq-bar:nth-child(1){animation-delay:0s;}
.vc-eq-bar:nth-child(2){animation-delay:.1s;}
.vc-eq-bar:nth-child(3){animation-delay:.2s;}
.vc-eq-bar:nth-child(4){animation-delay:.3s;}
@keyframes eqBounce{from{transform:scaleY(.4);}to{transform:scaleY(1.2);}}
.vc-watched-dot{
  position:absolute;top:7px;right:7px;
  width:8px;height:8px;border-radius:50%;background:var(--green);
  box-shadow:0 0 6px rgba(166,227,161,.6);
}
.vc-info{
  padding:10px 12px 13px;
  background:linear-gradient(180deg,var(--mantle),rgba(24,24,37,.98));
}
.vc-name{
  font-size:.82rem;color:var(--text);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  margin-bottom:5px;min-height:2.3em;
}
.vcard:hover .vc-name{color:var(--accent);}
.vcard.watched .vc-name{color:var(--subtext0);}
.vcard.playing .vc-name{color:var(--accent);}
.vc-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.vc-group{font-size:.62rem;color:var(--overlay0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ══ PLAYER ══ */
#S-player{display:flex;flex-direction:column;overflow:hidden;background:#000;}
#pbar{
  flex-shrink:0;height:56px;padding:0 18px;
  background:rgba(17,17,27,.97);border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;gap:10px;
  position:relative;z-index:20;
}
#pbar::after{
  content:'';position:absolute;top:0;left:0;right:0;height:1.5px;
  background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent);opacity:.35;
}
.ptitle{flex:1;min-width:0;font-size:.88rem;color:var(--subtext1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pctrl{display:flex;align-items:center;gap:9px;flex-shrink:0;}
.pnav{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;color:var(--crust);
  padding:9px 18px;border-radius:9px;cursor:pointer;
  font-size:.82rem;font-weight:700;font-family:var(--fm);transition:all .2s;
}
.pnav:hover{transform:scale(1.06);box-shadow:0 0 20px rgba(137,220,235,.45);}
.pnav:disabled{opacity:.22;cursor:not-allowed;transform:none;box-shadow:none;}
.ppages{
  background:rgba(49,50,68,.9);border:1px solid var(--bdr);
  color:var(--accent);padding:9px 14px;border-radius:9px;
  font-size:.78rem;min-width:60px;text-align:center;white-space:nowrap;
}
#pScroll{
  flex:1;min-height:0;
  display:flex;flex-direction:column;overflow:hidden;
}
#videoWrap{
  flex:1;min-height:0;width:100%;
  display:flex;align-items:center;justify-content:center;
  background:#000;
}
#mainVideo{
  max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;
  background:#000;outline:none;
  image-rendering:high-quality;
  -webkit-image-rendering:high-quality;
  color-rendering:optimizeQuality;
}
#subBar{
  flex-shrink:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:6px 14px;background:rgba(17,17,27,.97);
  border-top:1px solid rgba(137,220,235,.12);min-height:36px;z-index:20;
}
.sub-label{font-size:.65rem;color:var(--overlay1);white-space:nowrap;margin-right:4px;flex-shrink:0;}
.sub-btn{
  background:rgba(49,50,68,.7);border:1px solid var(--bdr);color:var(--subtext0);
  padding:4px 10px;border-radius:14px;font-size:.62rem;font-family:var(--fm);
  cursor:pointer;transition:all .18s;white-space:nowrap;max-width:200px;
  overflow:hidden;text-overflow:ellipsis;
}
.sub-btn:hover{border-color:var(--accent);color:var(--accent);}
.sub-btn.on{background:rgba(137,220,235,.15);border-color:var(--accent);color:var(--accent);}
.sub-hint{font-size:.6rem;color:var(--overlay0);white-space:nowrap;}
.sub-hint-right{margin-left:auto;}

/* fullscreen */
#videoWrap:-webkit-full-screen,
#videoWrap:fullscreen{
  width:100vw!important;height:100vh!important;background:#000!important;
  display:flex!important;align-items:center!important;justify-content:center!important;
}
#videoWrap:fullscreen video,
#videoWrap:-webkit-full-screen video{
  width:100%!important;height:100%!important;object-fit:contain!important;
}
video::-webkit-media-controls-fullscreen-button{display:none!important;}
video::-webkit-media-controls-picture-in-picture-button{display:none!important;}

/* ══ TOAST ══ */
#toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(10px);z-index:4000;
  background:rgba(69,71,90,.95);color:var(--text);
  border:1px solid var(--bdr);backdrop-filter:blur(14px);
  padding:10px 22px;border-radius:20px;font-size:.75rem;white-space:nowrap;
  opacity:0;pointer-events:none;transition:.3s;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- TITLEBAR -->
<div id="titlebar">
  <div class="win-btns">
    <button class="wb" id="wc"></button>
    <button class="wb" id="wm"></button>
    <button class="wb" id="wx"></button>
  </div>
  <div class="tb-logo">VIDEO VAULT</div>
  <div class="tb-right">
    <input type="text" id="searchBar" class="tb-input" placeholder="🔍  Search videos…" style="display:none">
    <select id="sortSel" class="tb-sel" style="display:none">
      <option value="az">A → Z</option>
      <option value="za">Z → A</option>
      <option value="most">Most Videos</option>
      <option value="prog">By Progress</option>
    </select>
    <button class="tb-btn" id="tb-change" style="display:none">⏏ Change</button>
    <button class="tb-btn" id="tb-fs">⛶</button>
    <div id="counter" style="display:none">0 channels</div>
  </div>
</div>

<!-- WELCOME -->
<div id="welcome">
  <div class="wbox">
    <div class="wbox-logo">VIDEO VAULT</div>
    <div class="wbox-sub">Catppuccin Mocha · Local Player</div>
    <div id="recentPaths"></div>
    <div class="dropzone" id="dropzone">
      <div id="dzMain">
        <div class="dz-icon">📺</div>
        <div class="dz-label">Drop your videos library folder</div>
        <div class="dz-hint">
          Supports: Channels · Playlists · Flat folders<br>
          Formats: MP4 · MKV · WebM · AVI · and more
        </div>
        <div class="btn-row">
          <button class="btn-p" id="openBtn">Open Folder</button>
        </div>
      </div>
      <div id="loadState">
        <div class="load-msg" id="loadMsg">Scanning…</div>
        <div class="spinner"></div>
        <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
      </div>
    </div>
  </div>
</div>

<!-- LIBRARY -->
<div class="app-screen" id="S-lib">
  <div class="lib-body">
    <div class="sec-label" id="libLabel">Channels</div>
    <div class="title-grid" id="titleGrid"></div>
  </div>
</div>

<!-- VIDEO LIST -->
<div class="app-screen" id="S-ep">
  <div class="epbar">
    <div class="epbar-thumb"><img id="epCover" src="" alt=""></div>
    <div class="epbar-info">
      <div class="epbar-title" id="epTitle">—</div>
      <div class="epbar-sub" id="epSub">—</div>
    </div>
    <button class="tb-btn" id="epBackBtn">← Back</button>
    <button class="tb-btn" id="watchAllBtn">▶ Play All</button>
  </div>
  <div class="ep-body">
    <div id="groupsBar"></div>
    <div id="continueSlot"></div>
    <div class="video-grid" id="epGrid"></div>
  </div>
</div>

<!-- PLAYER -->
<div class="app-screen" id="S-player">
  <div id="pbar">
    <button class="tb-btn" id="pBackBtn">← Back</button>
    <div class="ptitle" id="pTitle">—</div>
    <div class="pctrl">
      <button class="pnav" id="pPrev">◀ PREV</button>
      <button class="pnav" id="pNext">NEXT ▶</button>
      <button class="tb-btn" id="pFs" title="Fullscreen (F)">⛶</button>
      <div class="ppages" id="pPages">—</div>
    </div>
  </div>
  <div id="pScroll">
    <div id="videoWrap">
      <video id="mainVideo" controls preload="auto"></video>
    </div>
  </div>
  <div id="subBar"></div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script src="renderer.js"></script>
</body>
</html>
