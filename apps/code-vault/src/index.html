<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Code Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.11.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --base:#1e1e2e;--mantle:#181825;--crust:#11111b;
  --surface0:#313244;--surface1:#45475a;--surface2:#585b70;
  --overlay0:#6c7086;--overlay1:#7f849c;--overlay2:#9399b2;
  --text:#cdd6f4;--subtext0:#a6adc8;--subtext1:#bac2de;
  --lavender:#b4befe;--blue:#89b4fa;--sapphire:#74c7ec;
  --sky:#89dceb;--teal:#94e2d5;--green:#a6e3a1;
  --yellow:#f9e2af;--peach:#fab387;--red:#f38ba8;
  --maroon:#eba0ac;--pink:#f5c2e7;--mauve:#cba6f7;
  --rosewater:#f5e0dc;--flamingo:#f2cdcd;
  /* Code accent: blue → green, a "terminal" duotone */
  --accent:#89b4fa;--accent2:#a6e3a1;--accentGlow:rgba(137,180,250,.18);
  --bdr:rgba(108,112,134,.28);
  --hh:66px;
  --fd:'Bebas Neue',sans-serif;--fm:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.4,0,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:var(--base);color:var(--text);font-family:var(--fm);overflow:hidden;user-select:none;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--surface1);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--accent);}

/* color helpers, matched to langmap.js `color` keys */
.c-blue{color:var(--blue);} .c-green{color:var(--green);} .c-yellow{color:var(--yellow);}
.c-peach{color:var(--peach);} .c-red{color:var(--red);} .c-maroon{color:var(--maroon);}
.c-pink{color:var(--pink);} .c-mauve{color:var(--mauve);} .c-sky{color:var(--sky);}
.c-sapphire{color:var(--sapphire);} .c-teal{color:var(--teal);} .c-lavender{color:var(--lavender);}
.c-subtext0{color:var(--subtext0);} .c-subtext1{color:var(--subtext1);}
.bg-blue{background:var(--blue);} .bg-green{background:var(--green);} .bg-yellow{background:var(--yellow);}
.bg-peach{background:var(--peach);} .bg-red{background:var(--red);} .bg-maroon{background:var(--maroon);}
.bg-pink{background:var(--pink);} .bg-mauve{background:var(--mauve);} .bg-sky{background:var(--sky);}
.bg-sapphire{background:var(--sapphire);} .bg-teal{background:var(--teal);} .bg-lavender{background:var(--lavender);}
.bg-subtext0{background:var(--subtext0);} .bg-subtext1{background:var(--subtext1);}

/* ══ TITLEBAR ══ */
#titlebar{
  -webkit-app-region:drag;
  position:fixed;top:0;left:0;right:0;height:var(--hh);z-index:1000;
  display:flex;align-items:center;padding:0 22px;gap:16px;
  background:rgba(17,17,27,.97);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bdr);
}
#titlebar::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1.5px;
  background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent);
  opacity:.5;
}
.win-btns{display:flex;gap:8px;-webkit-app-region:no-drag;flex-shrink:0;}
.wb{width:14px;height:14px;border-radius:50%;border:none;cursor:pointer;transition:all .2s;}
.wb:hover{transform:scale(1.25);}
#wc{background:#f38ba8;box-shadow:0 0 8px rgba(243,139,168,.5);}
#wm{background:#f9e2af;box-shadow:0 0 8px rgba(249,226,175,.5);}
#wx{background:#a6e3a1;box-shadow:0 0 8px rgba(166,227,161,.5);}

.tb-logo{
  font-family:var(--fd);font-size:1.9rem;letter-spacing:4px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  -webkit-app-region:drag;display:flex;align-items:center;gap:8px;
}
.tb-logo .gl{-webkit-text-fill-color:var(--overlay1);font-size:1.5rem;}
.tb-right{flex:1;display:flex;align-items:center;gap:10px;justify-content:flex-end;-webkit-app-region:no-drag;}
.tb-group{display:flex;align-items:center;gap:8px;}
.tb-divider{width:1px;height:22px;background:var(--bdr);flex-shrink:0;}
.tb-input{
  background:rgba(49,50,68,.8);border:1px solid var(--bdr);color:var(--text);
  padding:9px 15px;border-radius:9px;font-size:13.5px;font-family:var(--fm);
  outline:none;width:280px;transition:.3s;
}
.tb-input:focus{border-color:var(--accent);width:360px;box-shadow:0 0 14px var(--accentGlow);}
.tb-input::placeholder{color:var(--overlay0);}
.tb-btn{
  -webkit-app-region:no-drag;
  background:rgba(49,50,68,.8);border:1px solid var(--bdr);color:var(--text);
  padding:9px 16px;border-radius:9px;font-size:13.5px;font-family:var(--fm);
  cursor:pointer;transition:all .2s var(--ease);white-space:nowrap;
}
.tb-btn:hover{background:var(--accent);color:var(--crust);border-color:var(--accent);}
.tb-btn.on{background:rgba(137,180,250,.15);border-color:rgba(137,180,250,.35);color:var(--accent);}
.tb-btn.tb-icon{padding:9px 12px;font-size:15px;}
#counter{
  background:rgba(49,50,68,.8);border:1px solid var(--bdr);
  color:var(--accent);padding:9px 16px;border-radius:20px;
  font-size:12.5px;white-space:nowrap;min-width:90px;text-align:center;flex-shrink:0;
}

/* ══ WELCOME ══ */
#welcome{
  position:fixed;inset:0;z-index:500;
  display:flex;align-items:center;justify-content:center;
  background:var(--crust);transition:opacity .4s,visibility .4s;
}
#welcome::before{
  content:'';position:absolute;inset:-50%;pointer-events:none;
  background:linear-gradient(rgba(137,180,250,.04) 1px,transparent 1px),
             linear-gradient(90deg,rgba(137,180,250,.04) 1px,transparent 1px);
  background-size:40px 40px;animation:gridDrift 24s linear infinite;
}
#welcome::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 55% 45% at 25% 35%,rgba(137,180,250,.07),transparent),
             radial-gradient(ellipse 45% 55% at 75% 65%,rgba(166,227,161,.06),transparent);
}
@keyframes gridDrift{to{transform:translate(40px,40px);}}
#welcome.hidden{opacity:0;visibility:hidden;pointer-events:none;}

.wbox{
  position:relative;z-index:1;width:min(680px,88vw);
  background:rgba(24,24,37,.88);backdrop-filter:blur(28px);
  border:1px solid rgba(137,180,250,.2);border-radius:28px;
  padding:52px 48px;text-align:center;
  box-shadow:0 0 60px rgba(137,180,250,.1),0 32px 80px rgba(0,0,0,.6);
}
.wbox-logo{
  font-family:var(--fd);font-size:clamp(3rem,6.2vw,4.6rem);letter-spacing:7px;line-height:1;
  background:linear-gradient(135deg,var(--accent),var(--accent2) 55%,var(--sky));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 28px rgba(137,180,250,.22));margin-bottom:8px;
}
.wbox-sub{
  font-size:.72rem;letter-spacing:5px;color:var(--overlay1);text-transform:uppercase;
  margin-bottom:32px;
  display:flex;align-items:center;justify-content:center;gap:12px;
}
.wbox-sub::before,.wbox-sub::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--bdr),transparent);}

#recentPaths{margin-bottom:20px;display:flex;flex-direction:column;gap:8px;}
.recent-item{
  background:rgba(49,50,68,.4);border:1px solid var(--bdr);border-radius:10px;
  padding:11px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;
  transition:all .2s;text-align:left;
}
.recent-item:hover{border-color:var(--accent);background:rgba(137,180,250,.08);}
.recent-icon{font-size:1.1rem;flex-shrink:0;}
.recent-info{flex:1;min-width:0;}
.recent-name{font-size:.85rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.recent-path{font-size:.62rem;color:var(--overlay0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.recent-arrow{color:var(--accent);font-size:1rem;flex-shrink:0;}

.dropzone{
  border:1.5px dashed rgba(137,180,250,.25);border-radius:18px;
  padding:32px 24px;background:rgba(49,50,68,.2);
  cursor:pointer;transition:all .3s;
}
.dropzone:hover,.dropzone.over{
  border-color:var(--accent);background:rgba(137,180,250,.07);
  box-shadow:0 0 30px rgba(137,180,250,.12);
}
.dz-icon{font-size:2.4rem;margin-bottom:10px;}
.dz-label{color:var(--subtext0);font-size:1rem;margin-bottom:20px;}
.btn-row{display:flex;gap:12px;justify-content:center;}
.btn-p{
  padding:13px 38px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;border-radius:40px;color:var(--crust);
  font-size:15px;font-family:var(--fm);font-weight:700;
  cursor:pointer;transition:all .3s;box-shadow:0 0 20px rgba(137,180,250,.3);
}
.btn-p:hover{transform:translateY(-3px);box-shadow:0 0 34px rgba(137,180,250,.55);}

#loadState{display:none;padding:16px 0;}
.spinner{width:42px;height:42px;border:3px solid rgba(137,180,250,.15);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:10px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.prog-bar{width:100%;height:3px;background:rgba(137,180,250,.1);border-radius:2px;margin-top:14px;overflow:hidden;}
.prog-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .2s;}
.load-msg{color:var(--sapphire);font-size:.88rem;margin-bottom:6px;}

/* ══ APP SCREENS ══ */
.app-screen{
  position:fixed;top:var(--hh);bottom:0;left:0;right:0;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .3s var(--ease),visibility .3s;
}
.app-screen.vis{opacity:1;visibility:visible;pointer-events:auto;}

/* ══ BROWSE ══ */
#S-browse{display:flex;flex-direction:column;overflow:hidden;background:var(--base);}
.crumbbar{
  flex-shrink:0;padding:11px 28px;
  background:rgba(24,24,37,.95);border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;gap:3px;font-size:.83rem;overflow-x:auto;white-space:nowrap;
}
.crumb{
  color:var(--overlay1);cursor:pointer;transition:.18s var(--ease);
  padding:6px 11px;border-radius:8px;display:inline-flex;align-items:center;
  border:1px solid transparent;
}
.crumb:hover{color:var(--accent);background:rgba(137,180,250,.1);border-color:rgba(137,180,250,.2);}
.crumb.last{
  color:var(--accent);font-weight:700;cursor:default;
  background:rgba(137,180,250,.12);border-color:rgba(137,180,250,.3);
}
.crumb-sep{color:var(--overlay0);font-size:.95rem;opacity:.55;flex-shrink:0;padding:0 1px;}
.browse-body{flex:1;overflow-y:auto;padding:26px 32px 40px;}
.sec-label{
  font-family:var(--fd);font-size:1.05rem;letter-spacing:2px;color:var(--subtext0);
  text-transform:uppercase;margin-bottom:18px;
  display:flex;align-items:center;gap:12px;
}
.sec-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--bdr),transparent);}

.item-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:16px;
}
.item-grid.assets{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));margin-top:22px;}

/* folder card */
.fcard{
  background:var(--mantle);border:1px solid var(--bdr);border-radius:16px;
  overflow:hidden;cursor:pointer;transition:all .25s var(--spring);position:relative;
  padding:18px;display:flex;flex-direction:column;gap:10px;
}
.fcard:hover{
  border-color:var(--accent);transform:translateY(-5px) scale(1.01);
  box-shadow:0 18px 40px rgba(0,0,0,.55),0 0 0 1px rgba(137,180,250,.15),0 0 26px rgba(137,180,250,.08);
}
.fcard-top{display:flex;align-items:center;gap:12px;}
.fcard-icon{font-size:1.7rem;flex-shrink:0;}
.fcard-name{font-size:.92rem;font-weight:600;color:var(--text);line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.fcard-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:auto;}
.fcard-count{font-size:.68rem;color:var(--overlay1);}
.fcard-langs{display:flex;gap:4px;margin-left:auto;}
.lang-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* code file card */
.ccard{
  background:rgba(49,50,68,.45);border:1px solid var(--bdr);border-radius:13px;
  padding:14px 16px;cursor:pointer;transition:all .2s var(--spring);position:relative;
  display:flex;align-items:flex-start;gap:11px;
}
.ccard:hover{background:rgba(137,180,250,.1);border-color:var(--accent);transform:scale(1.015);box-shadow:0 8px 22px rgba(137,180,250,.16);}
.ccard.visited{border-color:rgba(166,227,161,.22);}
.ccard-icon{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:.62rem;font-weight:800;font-family:var(--fm);color:var(--crust);}
.ccard-info{flex:1;min-width:0;}
.ccard-name{font-size:.83rem;font-weight:600;color:var(--text);line-height:1.35;word-break:break-word;}
.ccard-meta{font-size:.65rem;color:var(--overlay0);margin-top:4px;}
.ccard-dot{position:absolute;top:9px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--green);}
.ccard-star{position:absolute;bottom:9px;right:9px;font-size:.9rem;color:var(--overlay0);cursor:pointer;transition:.15s;z-index:2;}
.ccard-star:hover{transform:scale(1.2);}
.ccard-star.on{color:var(--yellow);}

/* asset file chip */
.acard{
  background:rgba(49,50,68,.25);border:1px solid var(--bdr);border-radius:11px;
  padding:11px 13px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:9px;
  opacity:.72;
}
.acard:hover{opacity:1;border-color:var(--overlay1);background:rgba(49,50,68,.45);}
.acard-icon{font-size:1.05rem;flex-shrink:0;}
.acard-info{flex:1;min-width:0;}
.acard-name{font-size:.72rem;color:var(--subtext0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.acard-meta{font-size:.6rem;color:var(--overlay0);margin-top:2px;}

.empty-hint{color:var(--overlay0);font-size:.85rem;text-align:center;padding:60px 20px;}

/* ══ VIEWER ══ */
#S-view{display:flex;flex-direction:column;overflow:hidden;background:var(--crust);}
.vbar{
  flex-shrink:0;min-height:60px;padding:10px 20px;
  background:rgba(17,17,27,.97);border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  position:relative;z-index:20;
}
.vbar::after{
  content:'';position:absolute;top:0;left:0;right:0;height:1.5px;
  background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent);opacity:.35;
}
.vtitle{flex:1;min-width:120px;font-size:.86rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);}
.vtitle .vpath{color:var(--overlay0);font-weight:400;font-size:.74rem;}
.vpill{font-size:.65rem;font-weight:700;padding:5px 11px;border-radius:20px;color:var(--crust);white-space:nowrap;}
.vctrl{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.vnav{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;color:var(--crust);
  padding:8px 16px;border-radius:8px;cursor:pointer;
  font-size:.78rem;font-weight:700;font-family:var(--fm);transition:all .2s;
}
.vnav:hover{transform:scale(1.06);box-shadow:0 0 18px rgba(137,180,250,.4);}
.vnav:disabled{opacity:.22;cursor:not-allowed;transform:none;box-shadow:none;}
.vmeta{
  background:rgba(49,50,68,.9);border:1px solid var(--bdr);
  color:var(--accent);padding:8px 12px;border-radius:8px;
  font-size:.75rem;min-width:34px;text-align:center;white-space:nowrap;cursor:pointer;transition:.15s;
}
.vmeta:hover{border-color:var(--accent);}
.vmeta.on{background:rgba(137,180,250,.15);border-color:var(--accent);}

.view-body{flex:1;overflow:auto;background:var(--crust);}
.code-wrap{display:flex;min-height:100%;font-family:var(--fm);font-size:13.5px;line-height:1.65;}
.gutter{
  flex-shrink:0;padding:18px 14px 18px 20px;text-align:right;color:var(--overlay0);
  user-select:none;border-right:1px solid var(--bdr);background:rgba(24,24,37,.5);
}
.gutter div{white-space:pre;}
.code-pane{flex:1;padding:18px 22px;overflow-x:auto;user-select:text;-webkit-user-select:text;cursor:text;}
.code-pane.wrap pre{white-space:pre-wrap;word-break:break-word;}
.code-pane pre{white-space:pre;margin:0;}
.code-pane code{font-family:var(--fm);background:transparent!important;padding:0!important;}
.trunc-note{padding:10px 22px;background:rgba(250,179,135,.1);color:var(--peach);font-size:.75rem;border-bottom:1px solid var(--bdr);}
.asset-note{padding:60px 20px;text-align:center;color:var(--overlay0);font-size:.9rem;}
.asset-note .aicon{font-size:3rem;margin-bottom:16px;}

/* markdown rendering */
.md-render{padding:26px 34px;max-width:820px;margin:0 auto;line-height:1.7;font-family:'JetBrains Mono',monospace;user-select:text;-webkit-user-select:text;}
.md-render h1,.md-render h2,.md-render h3,.md-render h4,.md-render h5,.md-render h6{
  font-family:var(--fm);font-weight:700;margin:22px 0 10px;color:var(--accent);letter-spacing:.2px;}
.md-render h1{font-size:1.55rem;border-bottom:1px solid var(--bdr);padding-bottom:8px;}
.md-render h2{font-size:1.3rem;}
.md-render h3{font-size:1.12rem;color:var(--accent2);}
.md-render h4{font-size:1rem;color:var(--sky);}
.md-render h5,.md-render h6{font-size:.92rem;color:var(--subtext1);}
.md-render p{margin:10px 0;color:var(--text);font-size:.9rem;word-break:break-word;}
.md-render code{background:var(--surface0);padding:2px 6px;border-radius:5px;font-size:.85em;color:var(--peach);word-break:break-word;}
.md-render pre{background:var(--mantle);border:1px solid var(--bdr);border-radius:10px;padding:14px 16px;overflow-x:auto;margin:12px 0;white-space:pre-wrap;word-break:break-word;}
.md-render pre code{background:transparent;padding:0;color:var(--text);white-space:inherit;}
.md-render ul,.md-render ol{margin:10px 0 10px 4px;padding-left:22px;color:var(--text);font-size:.9rem;}
.md-render li{word-break:break-word;}
.md-render a,.md-render a:visited{color:var(--blue);cursor:pointer;text-decoration:none;border-bottom:1px solid rgba(137,180,250,.45);font-weight:600;transition:.15s;}
.md-render a:hover{color:var(--lavender);border-bottom-color:var(--lavender);}
.md-render blockquote{border-left:3px solid var(--accent);padding:4px 16px;color:var(--subtext0);margin:12px 0;background:rgba(137,180,250,.05);white-space:pre-wrap;word-break:break-word;}
.md-render hr{border:none;border-top:1px solid var(--bdr);margin:20px 0;}
.md-render strong{color:var(--yellow);}
.md-render img{max-width:100%;border-radius:8px;display:block;margin:10px 0;}
.md-render table{border-collapse:collapse;margin:12px 0;font-size:.85rem;}
.md-render th,.md-render td{border:1px solid var(--bdr);padding:6px 12px;}
.md-render th{background:var(--surface0);}

/* notebook rendering */
.nb-wrap{padding:22px 30px;max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px;user-select:text;-webkit-user-select:text;}
.nb-cell{border-radius:12px;overflow:hidden;border:1px solid var(--bdr);min-width:0;}
.nb-cell.code{background:var(--mantle);}
.nb-cell.markdown{background:transparent;border-color:transparent;padding:0 4px;}
.nb-cell-head{font-size:.62rem;color:var(--overlay0);padding:8px 14px 0;letter-spacing:1px;text-transform:uppercase;}
.nb-cell.code .nb-cell-body{padding:6px 16px 14px;overflow-x:auto;min-width:0;}
.nb-cell.code pre{margin:0;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;min-width:0;}
.nb-out{margin-top:8px;padding:10px 14px;background:rgba(0,0,0,.25);border-top:1px solid var(--bdr);
  font-size:12.5px;color:var(--subtext0);white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto;}
.nb-out.err{color:var(--red);}
.nb-out-img{margin-top:8px;padding:10px 14px;background:rgba(0,0,0,.25);border-top:1px solid var(--bdr);
  overflow-x:auto;text-align:center;}
.nb-out-img img{max-width:100%;height:auto;border-radius:6px;}
.nb-out img{max-width:100%;border-radius:6px;}

/* ══ ASSET PREVIEWS (images / pdf / audio / video / fonts / docx / xlsx) ══ */
.asset-media{display:flex;align-items:center;justify-content:center;min-height:100%;padding:24px;}
.asset-media img{max-width:100%;max-height:calc(100vh - var(--hh) - 120px);object-fit:contain;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.asset-media audio,.asset-media video{max-width:100%;border-radius:10px;}
.asset-media video{max-height:calc(100vh - var(--hh) - 120px);}
.pdf-frame{width:100%;height:100%;border:none;background:var(--crust);display:block;}
.html-preview-frame{width:100%;height:100%;border:none;background:#fff;display:block;}
.font-preview{padding:36px 40px;max-width:820px;margin:0 auto;}
.font-preview .fp-alphabet{font-size:2.3rem;line-height:1.5;color:var(--text);word-break:break-word;margin-bottom:18px;}
.font-preview .fp-sample{font-size:1.1rem;color:var(--subtext1);margin:10px 0;}
.font-preview .fp-size{padding:14px 0;border-top:1px solid var(--bdr);}
.font-preview .fp-label{font-size:.62rem;color:var(--overlay0);letter-spacing:1px;text-transform:uppercase;font-family:var(--fm);margin-bottom:6px;}
.docx-render,.xlsx-render{padding:26px 34px;max-width:860px;margin:0 auto;user-select:text;-webkit-user-select:text;}
.docx-render{background:#fff;color:#1a1a1a;border-radius:10px;line-height:1.6;font-family:'JetBrains Mono',monospace;font-size:.88rem;}
.docx-render h1,.docx-render h2,.docx-render h3{color:#11111b;margin:16px 0 8px;}
.docx-render img{max-width:100%;border-radius:6px;}
.docx-render table{border-collapse:collapse;margin:12px 0;}
.docx-render th,.docx-render td{border:1px solid #ccc;padding:6px 10px;}
.xlsx-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.xlsx-tab{background:rgba(49,50,68,.6);border:1px solid var(--bdr);color:var(--subtext0);
  padding:7px 14px;border-radius:8px;font-size:.75rem;cursor:pointer;transition:.15s;}
.xlsx-tab:hover{border-color:var(--accent);color:var(--text);}
.xlsx-tab.on{background:var(--accent);color:var(--crust);border-color:var(--accent);font-weight:700;}
.xlsx-table-wrap{overflow:auto;border:1px solid var(--bdr);border-radius:10px;max-height:calc(100vh - var(--hh) - 220px);}
.xlsx-table{border-collapse:collapse;font-size:.78rem;white-space:nowrap;}
.xlsx-table th,.xlsx-table td{border:1px solid var(--bdr);padding:6px 12px;}
.xlsx-table th{background:var(--surface0);color:var(--text);position:sticky;top:0;}
.xlsx-table tr:nth-child(even) td{background:rgba(255,255,255,.02);}
.xlsx-note{padding:10px 0;color:var(--overlay0);font-size:.72rem;}
.unsupported-note{padding:70px 24px;text-align:center;color:var(--overlay0);font-size:.9rem;max-width:420px;margin:0 auto;}
.unsupported-note .aicon{font-size:3.4rem;margin-bottom:18px;}
.unsupported-note .un-name{color:var(--text);font-weight:600;font-size:1rem;margin-bottom:6px;word-break:break-word;}
.unsupported-note .un-meta{color:var(--overlay1);font-size:.75rem;margin-bottom:22px;}
.unsupported-note .un-btn{
  background:rgba(49,50,68,.8);border:1px solid var(--bdr);color:var(--text);
  padding:10px 20px;border-radius:9px;font-size:.8rem;font-family:var(--fm);cursor:pointer;transition:.2s;}
.unsupported-note .un-btn:hover{border-color:var(--accent);color:var(--accent);}

/* ══ SEARCH RESULTS ══ */
.sres-item{
  background:rgba(49,50,68,.4);border:1px solid var(--bdr);border-radius:12px;
  padding:13px 17px;cursor:pointer;transition:.2s;display:flex;align-items:flex-start;gap:13px;margin-bottom:8px;
}
.sres-item:hover{border-color:var(--accent);background:rgba(137,180,250,.08);}
.sres-icon{width:26px;height:26px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:.58rem;font-weight:800;color:var(--crust);margin-top:1px;}
.sres-info{flex:1;min-width:0;}
.sres-name{font-size:.84rem;font-weight:600;color:var(--text);}
.sres-path{font-size:.66rem;color:var(--overlay0);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sres-line{font-size:.72rem;color:var(--subtext0);margin-top:5px;font-family:var(--fm);background:rgba(0,0,0,.2);padding:4px 8px;border-radius:5px;display:inline-block;}
.sres-line b{color:var(--yellow);font-weight:700;}

/* ══ STATS ══ */
#S-stats{display:flex;flex-direction:column;overflow:hidden;background:var(--base);}
.stats-body{flex:1;overflow-y:auto;padding:30px 40px 50px;max-width:900px;margin:0 auto;width:100%;}
.stats-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:32px;}
.stat-card{background:var(--mantle);border:1px solid var(--bdr);border-radius:14px;padding:20px;text-align:center;}
.stat-num{font-family:var(--fd);font-size:2.1rem;letter-spacing:1px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.stat-label{font-size:.68rem;color:var(--overlay1);text-transform:uppercase;letter-spacing:1px;margin-top:4px;}
.lang-bar-row{display:flex;align-items:center;gap:12px;margin-bottom:11px;}
.lang-bar-name{width:130px;flex-shrink:0;font-size:.78rem;color:var(--subtext1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lang-bar-track{flex:1;height:9px;background:rgba(255,255,255,.05);border-radius:5px;overflow:hidden;}
.lang-bar-fill{height:100%;border-radius:5px;transition:width .5s var(--ease);}
.lang-bar-val{width:90px;flex-shrink:0;text-align:right;font-size:.7rem;color:var(--overlay0);}

/* ══ TOAST ══ */
#toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(10px);z-index:4000;
  background:rgba(69,71,90,.95);color:var(--text);
  border:1px solid var(--bdr);backdrop-filter:blur(14px);
  padding:10px 22px;border-radius:20px;font-size:.75rem;white-space:nowrap;
  opacity:0;pointer-events:none;transition:.3s;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* hljs — Catppuccin Mocha token colors */
.hljs{color:var(--text);background:transparent;}
.hljs-comment,.hljs-quote{color:var(--overlay1);font-style:italic;}
.hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-subst,.hljs-doctag{color:var(--mauve);}
.hljs-string,.hljs-regexp,.hljs-addition{color:var(--green);}
.hljs-number,.hljs-built_in,.hljs-builtin-name{color:var(--peach);}
.hljs-title,.hljs-title.function_,.hljs-section{color:var(--blue);}
.hljs-title.class_,.hljs-class .hljs-title{color:var(--yellow);}
.hljs-attr,.hljs-attribute,.hljs-variable,.hljs-template-variable{color:var(--flamingo);}
.hljs-symbol,.hljs-bullet,.hljs-link{color:var(--pink);}
.hljs-meta,.hljs-meta .hljs-keyword{color:var(--sapphire);}
.hljs-tag{color:var(--overlay1);}
.hljs-name{color:var(--mauve);}
.hljs-selector-id,.hljs-selector-class{color:var(--yellow);}
.hljs-deletion{color:var(--red);}
.hljs-emphasis{font-style:italic;}
.hljs-strong{font-weight:700;}
.hljs-formula{color:var(--sky);}
.hljs-params{color:var(--text);}
</style>
</head>
<body>

<!-- TITLEBAR -->
<div id="titlebar">
  <div class="win-btns">
    <button class="wb" id="wc"></button>
    <button class="wb" id="wm"></button>
    <button class="wb" id="wx"></button>
  </div>
  <div class="tb-logo"><span class="gl">&lt;/&gt;</span> VAULT</div>
  <div class="tb-right">
    <div class="tb-group" id="tbSearchGroup" style="display:none">
      <input type="text" id="searchBar" class="tb-input" placeholder="Search filenames or code…">
      <button class="tb-btn tb-icon" id="contentSearchBtn" title="Search inside file contents">🔎</button>
    </div>
    <div class="tb-divider" id="tbDiv1" style="display:none"></div>
    <div class="tb-group" id="tbToolsGroup" style="display:none">
      <button class="tb-btn" id="starredBtn" title="Starred files">★ Starred</button>
      <button class="tb-btn" id="statsBtn" title="Vault statistics">📊 Stats</button>
    </div>
    <div class="tb-divider" id="tbDiv2" style="display:none"></div>
    <div id="counter" style="display:none">0 files</div>
    <button class="tb-btn" id="tb-change" style="display:none" title="Open a different folder">⏏ Change</button>
    <button class="tb-btn tb-icon" id="tb-fs" title="Toggle fullscreen">⛶</button>
  </div>
</div>

<!-- WELCOME -->
<div id="welcome">
  <div class="wbox">
    <div class="wbox-logo">CODE VAULT</div>
    <div class="wbox-sub">Catppuccin Mocha · Local Source Code Library</div>

    <div id="recentPaths"></div>

    <div class="dropzone" id="dropzone">
      <div id="dzMain">
        <div class="dz-icon">🗂️</div>
        <div class="dz-label">Drop your code / repos folder here</div>
        <div class="btn-row">
          <button class="btn-p" id="openBtn">Open Folder</button>
        </div>
      </div>
      <div id="loadState">
        <div class="load-msg" id="loadMsg">Scanning…</div>
        <div class="spinner"></div>
        <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
      </div>
    </div>
  </div>
</div>

<!-- BROWSE (tree navigation) -->
<div class="app-screen" id="S-browse">
  <div class="crumbbar" id="crumbBar"></div>
  <div class="browse-body" id="browseBody">
    <div class="sec-label" id="browseLabel">Library</div>
    <div class="item-grid" id="itemGrid"></div>
    <div class="item-grid assets" id="assetGrid"></div>
  </div>
</div>

<!-- VIEWER -->
<div class="app-screen" id="S-view">
  <div class="vbar" id="vbar">
    <button class="tb-btn" id="vBackBtn">← Back</button>
    <div class="vtitle" id="vTitle">—</div>
    <span class="vpill" id="vPill">—</span>
    <div class="vctrl">
      <button class="vnav" id="vPrev">◀ PREV</button>
      <button class="vnav" id="vNext">NEXT ▶</button>
      <div class="vmeta" id="vWrap" title="Toggle word wrap">⇥ Wrap</div>
      <div class="vmeta" id="vMdToggle" title="Toggle rendered / raw" style="display:none">👁 Render</div>
      <div class="vmeta" id="vCopy" title="Copy contents">⧉ Copy</div>
      <div class="vmeta" id="vStar" title="Toggle star">☆</div>
      <div class="vmeta" id="vShowFolder" title="Show in file manager">📁</div>
    </div>
  </div>
  <div class="view-body" id="viewBody"></div>
</div>

<!-- STATS -->
<div class="app-screen" id="S-stats">
  <div class="crumbbar"><span class="crumb last">📊 Vault Statistics</span></div>
  <div class="stats-body" id="statsBody">
    <div class="stats-cards" id="statCards"></div>
    <div class="sec-label">Language Breakdown</div>
    <div id="langBars"></div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script src="langmap.js"></script>
<script src="renderer.js"></script>
</body>
</html>
